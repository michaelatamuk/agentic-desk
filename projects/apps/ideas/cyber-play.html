<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Range - hold the core</title>
<style>
  :root { --bg:#05070c; --ink:#e6f1f6; --muted:#6e8497; --soft:#3c4c5d; --red:#ff4d5e; --cyan:#5eead4; --amber:#ffb454; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; overflow:hidden; }
  button { font:inherit; cursor:pointer; }
  .stage { position:fixed; inset:0; background:
      radial-gradient(55% 45% at 50% 48%, rgba(20,45,66,.35), transparent 70%),
      radial-gradient(40% 35% at 80% 90%, rgba(255,77,94,.05), transparent 72%);
    }
  .stage svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .stage::after { content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(70% 60% at 50% 48%, transparent 45%, rgba(0,0,0,.55) 100%); }

  .grid-line { stroke:#0f1c28; stroke-width:1; }
  .ring { fill:none; stroke:#16283a; stroke-width:1; }
  .ring.dash { stroke-dasharray:3 8; }

  .edge { stroke:#1b2b3d; stroke-width:1.4; transition:stroke .25s, stroke-width .25s; }
  .edge.safe { stroke:#1d3a44; }
  .edge.infected { stroke:var(--red); stroke-width:1.9; stroke-dasharray:5 9; animation:flow 1.1s linear infinite; filter:drop-shadow(0 0 4px rgba(255,77,94,.55)); }
  .edge.live { stroke:#fff; stroke-width:2.6; filter:drop-shadow(0 0 8px #fff); }

  .node { cursor:pointer; }
  .node .n { fill:#08111a; stroke:#2a4054; stroke-width:1.4; transition:fill .25s, stroke .25s; }
  .node .halo { fill:none; stroke:transparent; stroke-width:1; }
  .node text { font-family:ui-monospace,monospace; font-size:8.5px; letter-spacing:.12em; fill:#6e8497; pointer-events:none; }
  .node:hover .n { stroke:#8ca3b5; }
  .node:hover text { fill:#c6d6e2; }
  .node.hardened .n { fill:#06201d; stroke:var(--cyan); stroke-width:2; }
  .node.hardened .halo { stroke:rgba(94,234,212,.35); stroke-width:5; }
  .node.hardened text { fill:var(--cyan); }
  .node.infected .n { fill:#2a0a10; stroke:var(--red); stroke-width:2; animation:throb 1.2s ease-in-out infinite; }
  .node.infected .halo { stroke:rgba(255,77,94,.28); stroke-width:8; }
  .node.infected text { fill:#ff8b96; }
  .node.infected.isolated .n { stroke:var(--cyan); fill:#141018; animation:none; }
  .node.infected.isolated .halo { stroke:rgba(94,234,212,.3); stroke-width:7; }
  .node.infected.isolated text { fill:var(--cyan); }
  .node.core .n { stroke:#3b5568; stroke-width:2.4; }
  .node.core text { fill:#9db2c2; font-size:10px; }
  .node.core.infected .n { stroke:var(--red); fill:#3a0910; animation:throb .7s ease-in-out infinite; }

  .hud { position:absolute; z-index:5; pointer-events:none; }
  .hud.tl { left:clamp(14px,2.4vw,30px); top:clamp(14px,2.4vw,26px); max-width:330px; }
  .hud.tr { right:clamp(14px,2.4vw,30px); top:clamp(14px,2.4vw,26px); text-align:right; }
  .hud.bl { left:clamp(14px,2.4vw,30px); bottom:clamp(14px,2.4vw,24px); max-width:420px; }
  .eyebrow { display:flex; align-items:center; gap:7px; font-size:8px; letter-spacing:.22em; text-transform:uppercase; color:var(--soft); font-weight:700; }
  .eyebrow i { width:6px; height:6px; border-radius:50%; background:var(--red); box-shadow:0 0 10px var(--red); }
  .hud h1 { margin:7px 0 5px; font-size:clamp(20px,3vw,34px); letter-spacing:-.03em; line-height:1; font-weight:800; }
  .hud p { margin:0; font-size:10px; color:var(--muted); line-height:1.55; max-width:310px; }
  .hud p b { color:#cfe2ec; font-weight:600; }
  .stat-label { font-size:8px; letter-spacing:.2em; text-transform:uppercase; color:var(--soft); }
  .timer { font-family:ui-monospace,monospace; font-size:clamp(26px,4vw,44px); letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1; color:#d9e8f1; }
  .timer.low { color:var(--red); animation:blink 1s steps(2,end) infinite; }
  .bar { width:170px; height:2px; background:#152534; margin:7px 0 0 auto; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--cyan); transition:width 1s linear; }
  .patches { display:flex; gap:4px; justify-content:flex-end; margin-top:9px; }
  .patches i { width:16px; height:4px; background:#1d3242; border-radius:2px; }
  .patches i.on { background:var(--cyan); box-shadow:0 0 8px rgba(94,234,212,.6); }
  .patch-count { font-family:ui-monospace,monospace; font-size:9px; color:var(--muted); margin-top:5px; }
  .patch-count b { color:var(--cyan); }

  .log { font-family:ui-monospace,monospace; font-size:9px; line-height:1.8; color:var(--muted); }
  .log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.9; }
  .log div:first-child { color:#cfe2ec; }
  .log b { color:var(--red); font-weight:600; }
  .log .ok { color:var(--cyan); }

  .toast { position:fixed; left:50%; bottom:64px; transform:translate(-50%,12px); z-index:30; background:#0e1a24; border:1px solid #2a4054; color:#d8e7f0; font-size:10px; padding:7px 11px; border-radius:5px; opacity:0; pointer-events:none; transition:.25s; }
  .toast.show { opacity:1; transform:translate(-50%,0); }
  .toast.bad { border-color:#5a2029; color:#ffb3bb; }

  .over { position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center; padding:22px; background:rgba(3,5,9,.82); backdrop-filter:blur(8px); text-align:center; }
  .over.open { display:flex; }
  .over .inner { max-width:520px; }
  .over .kicker { font-family:ui-monospace,monospace; font-size:9px; letter-spacing:.26em; color:var(--muted); }
  .over h2 { margin:10px 0 0; font-size:clamp(44px,9vw,92px); line-height:.9; letter-spacing:-.05em; }
  .over.win h2 { color:var(--cyan); text-shadow:0 0 50px rgba(94,234,212,.3); }
  .over.lose h2 { color:var(--red); text-shadow:0 0 50px rgba(255,77,94,.3); }
  .over p { color:var(--muted); font-size:12px; line-height:1.6; margin:14px auto 0; max-width:400px; }
  .over .stats { display:flex; gap:22px; justify-content:center; margin-top:22px; }
  .over .stats div { border-top:1px solid #22384a; padding-top:8px; min-width:80px; }
  .over .stats b { display:block; font-family:ui-monospace,monospace; font-size:18px; color:#e6f1f6; }
  .over .stats span { display:block; font-size:7px; letter-spacing:.2em; text-transform:uppercase; color:var(--soft); margin-top:3px; }
  .over button { margin-top:26px; border:1px solid var(--cyan); background:transparent; color:var(--cyan); border-radius:4px; padding:10px 18px; font-size:10px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; }
  .over.lose button { border-color:var(--red); color:var(--red); }
  .over button:hover { background:rgba(94,234,212,.1); }

  @keyframes flow { to { stroke-dashoffset:-28; } }
  @keyframes throb { 0%,100% { filter:drop-shadow(0 0 4px rgba(255,77,94,.4)); } 50% { filter:drop-shadow(0 0 14px rgba(255,77,94,.9)); } }
  @keyframes blink { 50% { opacity:.35; } }

  @media (max-width:760px) {
    .hud.tl { max-width:210px; }
    .hud p { font-size:9px; }
    .hud.bl { display:none; }
    .bar { width:120px; }
    .patches { margin-top:6px; }
  }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet" id="graph">
    <defs>
      <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
        <path d="M44 0H0V44" fill="none" stroke="#0d1924" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="1200" height="760" fill="url(#grid)" opacity=".7"/>
    <g id="rings">
      <circle class="ring dash" cx="660" cy="390" r="150"/>
      <circle class="ring" cx="660" cy="390" r="250"/>
      <circle class="ring dash" cx="660" cy="390" r="350"/>
    </g>
    <g id="edges"></g>
    <g id="nodes"></g>
    <g id="sweep">
      <line x1="0" y1="0" x2="0" y2="760" stroke="#5eead4" stroke-width="1" opacity=".08"/>
    </g>
  </svg>

  <div class="hud tl">
    <div class="eyebrow"><i></i> Exercise 07 &middot; live</div>
    <h1>Hold the core.</h1>
    <p>Click a node to <b>harden</b> it. Hardened nodes stop the spread. You have <b>5 patches</b> and <b>40 seconds</b>.</p>
  </div>

  <div class="hud tr">
    <div class="stat-label">Time to breach</div>
    <div class="timer" id="timer">00:40</div>
    <div class="bar"><i id="bar" style="width:100%"></i></div>
    <div class="patches" id="patchDots"></div>
    <div class="patch-count"><b id="patchCount">5</b> patches left</div>
  </div>

  <div class="hud bl">
    <div class="log" id="log"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="over" id="over">
  <div class="inner">
    <div class="kicker" id="overKicker">EXERCISE 07 &middot; DEBRIEF</div>
    <h2 id="overTitle">CONTAINED</h2>
    <p id="overText"></p>
    <div class="stats">
      <div><b id="stHeld">40s</b><span>held</span></div>
      <div><b id="stPatches">0</b><span>patches used</span></div>
      <div><b id="stLost">0</b><span>nodes lost</span></div>
    </div>
    <button id="again">Run it again</button>
  </div>
</div>

<script>
  const $ = s => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";

  const NODES = [
    { id: 1, x: 110, y: 390, label: "ENTRY" },
    { id: 2, x: 245, y: 255, label: "DNS" },
    { id: 3, x: 255, y: 525, label: "VPN" },
    { id: 4, x: 390, y: 170, label: "EDGE-1" },
    { id: 5, x: 405, y: 385, label: "EDGE-2" },
    { id: 6, x: 380, y: 585, label: "EDGE-3" },
    { id: 7, x: 530, y: 265, label: "HUB-A" },
    { id: 8, x: 545, y: 500, label: "HUB-B" },
    { id: 9, x: 660, y: 390, label: "CORE", core: true },
    { id: 10, x: 800, y: 235, label: "DATA-1" },
    { id: 11, x: 810, y: 545, label: "DATA-2" },
    { id: 12, x: 940, y: 320, label: "CLOUD-A" },
    { id: 13, x: 955, y: 480, label: "CLOUD-B" },
    { id: 14, x: 1080, y: 395, label: "ADMIN" }
  ];
  const EDGES = [
    [1,2],[1,3],[2,4],[2,5],[3,5],[3,6],[4,7],[5,7],[5,8],[6,8],
    [7,9],[8,9],[9,10],[9,11],[10,12],[11,13],[12,14],[13,14],[12,13]
  ];
  const CORE = 9;
  const byId = Object.fromEntries(NODES.map(n => [n.id, n]));

  const state = { infected: new Set([1]), isolated: new Set(), hardened: new Set(), patches: 5, left: 40, running: true, ended: false, spreadTimer: null, tickTimer: null };

  const gEdges = $("#edges");
  const gNodes = $("#nodes");
  const edgeEls = {};
  const nodeEls = {};

  function key(a, b) { return Math.min(a,b) + "-" + Math.max(a,b); }

  EDGES.forEach(([a, b]) => {
    const line = document.createElementNS(NS, "line");
    line.setAttribute("x1", byId[a].x); line.setAttribute("y1", byId[a].y);
    line.setAttribute("x2", byId[b].x); line.setAttribute("y2", byId[b].y);
    line.setAttribute("class", "edge");
    gEdges.appendChild(line);
    edgeEls[key(a,b)] = line;
  });

  NODES.forEach(n => {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "node" + (n.core ? " core" : ""));
    g.dataset.id = n.id;

    const halo = document.createElementNS(NS, "circle");
    halo.setAttribute("class", "halo");
    halo.setAttribute("cx", n.x); halo.setAttribute("cy", n.y);
    halo.setAttribute("r", n.core ? 36 : 25);
    g.appendChild(halo);

    const c = document.createElementNS(NS, "circle");
    c.setAttribute("class", "n");
    c.setAttribute("cx", n.x); c.setAttribute("cy", n.y);
    c.setAttribute("r", n.core ? 30 : 18);
    g.appendChild(c);

    if (n.core) {
      const rr = document.createElementNS(NS, "circle");
      rr.setAttribute("cx", n.x); rr.setAttribute("cy", n.y); rr.setAttribute("r", 21);
      rr.setAttribute("fill", "none"); rr.setAttribute("stroke", "#2a4054"); rr.setAttribute("stroke-width", "1");
      g.appendChild(rr);
    }

    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", n.x); t.setAttribute("y", n.y + (n.core ? 48 : 38));
    t.setAttribute("text-anchor", "middle");
    t.textContent = n.label;
    g.appendChild(t);

    g.addEventListener("click", () => harden(n.id));
    gNodes.appendChild(g);
    nodeEls[n.id] = g;
  });

  function render() {
    NODES.forEach(n => {
      const el = nodeEls[n.id];
      el.classList.toggle("infected", state.infected.has(n.id));
      el.classList.toggle("isolated", state.isolated.has(n.id));
      el.classList.toggle("hardened", state.hardened.has(n.id));
    });
    EDGES.forEach(([a, b]) => {
      const el = edgeEls[key(a,b)];
      const hot = state.infected.has(a) && state.infected.has(b) && !state.isolated.has(a) && !state.isolated.has(b);
      const safe = state.hardened.has(a) || state.hardened.has(b);
      el.classList.toggle("infected", hot);
      el.classList.toggle("safe", safe && !hot);
    });

    const dots = $("#patchDots");
    dots.innerHTML = "";
    for (let i = 0; i < 5; i++) {
      const d = document.createElement("i");
      if (i < state.patches) d.className = "on";
      dots.appendChild(d);
    }
    $("#patchCount").textContent = state.patches;
    const m = Math.floor(state.left / 60), s = state.left % 60;
    $("#timer").textContent = String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
    $("#timer").classList.toggle("low", state.left <= 10);
    $("#bar").style.width = (state.left / 40 * 100) + "%";
  }

  function log(text, ok) {
    const el = document.createElement("div");
    el.innerHTML = (ok ? '<span class="ok">&gt;</span> ' : '<b>&gt;</b> ') + text;
    const box = $("#log");
    box.prepend(el);
    while (box.children.length > 3) box.lastChild.remove();
  }

  function flash(a, b) {
    const el = edgeEls[key(a,b)];
    if (!el) return;
    el.classList.add("live");
    setTimeout(() => el.classList.remove("live"), 480);
  }

  let toastTimer;
  function toast(msg, bad) {
    const el = $("#toast");
    el.textContent = msg;
    el.className = "toast show" + (bad ? " bad" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.className = "toast", 1900);
  }

  function harden(id) {
    if (!state.running || state.ended) return;
    if (id === CORE) { toast("The core cannot be isolated. Hold the perimeter.", true); return; }
    if (state.hardened.has(id)) { toast("Node already hardened."); return; }
    if (state.patches <= 0) { toast("No patches left. Hold what you have.", true); return; }
    state.patches--;
    state.hardened.add(id);
    if (state.infected.has(id)) {
      state.isolated.add(id);
      log("isolated " + byId[id].label, true);
      toast(byId[id].label + " isolated. The spread stops here.", false);
    } else {
      log("hardened " + byId[id].label, true);
      toast(byId[id].label + " hardened.");
    }
    render();
  }

  function distToCore(id) {
    const n = byId[id];
    return Math.hypot(n.x - byId[CORE].x, n.y - byId[CORE].y);
  }

  function spread() {
    if (!state.running || state.ended) return;
    const active = [...state.infected].filter(id => !state.isolated.has(id));
    const cands = [];
    active.forEach(a => {
      EDGES.forEach(([x, y]) => {
        const b = x === a ? y : (y === a ? x : null);
        if (b === null) return;
        if (state.infected.has(b) || state.hardened.has(b)) return;
        if (cands.some(c => c.to === b)) return;
        cands.push({ from: a, to: b, d: distToCore(b) });
      });
    });
    if (!cands.length) return;
    cands.sort((p, q) => p.d - q.d);
    const picks = [cands[0]];
    const second = cands.find(c => c.to !== cands[0].to && Math.random() < .55);
    if (second) picks.push(second);

    for (const p of picks) {
      if (state.infected.has(p.to)) continue;
      flash(p.from, p.to);
      if (p.to === CORE) {
        state.infected.add(p.to);
        render();
        lose();
        return;
      }
      state.infected.add(p.to);
      log("lateral movement: " + byId[p.from].label + " \u2192 " + byId[p.to].label);
    }
    render();
  }

  function win() {
    end(true);
  }
  function lose() {
    end(false);
  }

  function end(won) {
    if (state.ended) return;
    state.ended = true;
    state.running = false;
    clearInterval(state.spreadTimer);
    clearInterval(state.tickTimer);
    const over = $("#over");
    over.classList.add("open");
    over.classList.toggle("win", won);
    over.classList.toggle("lose", !won);
    $("#overTitle").textContent = won ? "CONTAINED" : "BREACH";
    $("#overKicker").textContent = won ? "EXERCISE 07 \u00b7 CORE HELD" : "EXERCISE 07 \u00b7 CORE LOST";
    $("#overText").textContent = won
      ? "The attack never reached the core. Your patches held the line for the full 40 seconds."
      : "Lateral movement reached the core. The exercise is over — reset and try a different choke point.";
    $("#stHeld").textContent = (won ? 40 : 40 - state.left) + "s";
    $("#stPatches").textContent = 5 - state.patches;
    $("#stLost").textContent = [...state.infected].filter(id => id !== CORE).length;
  }

  function reset() {
    state.infected = new Set([1]);
    state.isolated = new Set();
    state.hardened = new Set();
    state.patches = 5;
    state.left = 40;
    state.running = true;
    state.ended = false;
    $("#over").classList.remove("open", "win", "lose");
    $("#log").innerHTML = "";
    log("exercise started \u00b7 entry point compromised");
    render();
    clearInterval(state.spreadTimer);
    clearInterval(state.tickTimer);
    state.spreadTimer = setInterval(spread, 1600);
    state.tickTimer = setInterval(() => {
      if (!state.running) return;
      state.left--;
      if (state.left <= 0) { state.left = 0; render(); win(); return; }
      render();
    }, 1000);
  }

  $("#again").addEventListener("click", reset);

  // scan sweep
  let sweepX = 0;
  const sweep = $("#sweep").firstElementChild;
  setInterval(() => {
    sweepX = (sweepX + 4) % 1200;
    sweep.setAttribute("x1", sweepX); sweep.setAttribute("x2", sweepX);
  }, 40);

  render();
  log("exercise started \u00b7 entry point compromised");
  state.spreadTimer = setInterval(spread, 1600);
  state.tickTimer = setInterval(() => {
    if (!state.running) return;
    state.left--;
    if (state.left <= 0) { state.left = 0; render(); win(); return; }
    render();
  }, 1000);
</script>
</body>
</html>
