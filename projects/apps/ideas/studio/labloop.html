<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Loop - Formulation Studio</title>
<style>
  :root {
    --bg: #070b09;
    --panel: #0f1512;
    --panel2: #121a16;
    --ink: #f0fdf4;
    --muted: #9ca3af;
    --soft: #6b7280;
    --line: #1f2a24;
    --accent: #34d399;
    --accent2: #22d3ee;
    --amber: #fbbf24;
    --red: #fb7185;
    --violet: #a78bfa;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 12px;
    line-height: 1.45;
    overflow: hidden;
  }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  .app { display: grid; grid-template-columns: 216px minmax(0, 1fr); height: 100vh; }

  /* Sidebar */
  .sidebar { background: #0a0f0c; border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 2px 6px 8px; }
  .mark { width: 30px; height: 30px; border-radius: 9px; background: radial-gradient(circle at 30% 25%, #a7f3d0, #34d399 35%, #0f766e 75%); box-shadow: 0 0 18px rgba(52,211,153,.3); flex: none; }
  .brand b { display: block; font-size: 13px; letter-spacing: -.01em; }
  .brand span { display: block; color: var(--soft); font-size: 8px; letter-spacing: .1em; text-transform: uppercase; margin-top: 1px; }
  .project { border: 1px solid var(--line); background: #0f1512; border-radius: 9px; padding: 9px; display: flex; align-items: center; gap: 8px; }
  .project-dot { width: 16px; height: 16px; border-radius: 5px; background: linear-gradient(135deg,#34d399,#0891b2); flex: none; }
  .project b { display: block; font-size: 10px; }
  .project small { display: block; color: var(--soft); font-size: 8px; margin-top: 1px; }
  .nav-label { font-size: 8px; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); font-weight: 800; padding: 0 8px 5px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item { display: flex; align-items: center; gap: 8px; border: 1px solid transparent; background: transparent; color: var(--muted); border-radius: 8px; padding: 7px 8px; text-align: left; font-size: 11px; font-weight: 600; }
  .nav-item:hover { background: #121a16; color: var(--ink); }
  .nav-item.active { background: #16231c; border-color: #244332; color: var(--ink); }
  .nav-item svg { width: 14px; height: 14px; flex: none; }
  .nav-item .count { margin-left: auto; background: #1b2a22; color: #86efac; border-radius: 999px; padding: 1px 5px; font-size: 8px; }
  .nav-item.active .count { background: #14532d; color: #bbf7d0; }
  .sidefoot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
  .agent-state { display: flex; align-items: center; gap: 7px; padding: 7px 8px; font-size: 9px; color: var(--muted); }
  .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(52,211,153,.12); animation: pulse 2s infinite; }
  .user { display: flex; align-items: center; gap: 8px; padding: 7px 8px; }
  .avatar { width: 25px; height: 25px; border-radius: 50%; background: #113b2b; color: #bbf7d0; display: grid; place-items: center; font-size: 9px; font-weight: 800; }
  .user b { display: block; font-size: 10px; }
  .user small { display: block; color: var(--soft); font-size: 8px; }

  /* Main */
  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { height: 56px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); background: rgba(7,11,9,.92); backdrop-filter: blur(10px); position: relative; z-index: 10; }
  .crumb { display: flex; align-items: center; gap: 6px; color: var(--soft); font-size: 10px; min-width: 0; }
  .crumb b { color: var(--ink); }
  .crumb .sep { color: #374151; }
  .search { margin-left: 12px; width: 220px; position: relative; }
  .search input { width: 100%; border: 1px solid var(--line); background: #0f1512; color: var(--ink); border-radius: 7px; padding: 6px 8px 6px 26px; font-size: 10px; outline: none; }
  .search input:focus { border-color: #2f6b4f; }
  .search svg { position: absolute; left: 7px; top: 7px; width: 12px; height: 12px; color: var(--soft); }
  .top-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .icon { width: 28px; height: 28px; border: 1px solid var(--line); background: #0f1512; border-radius: 7px; display: grid; place-items: center; color: var(--muted); position: relative; }
  .icon:hover { color: var(--ink); border-color: #374151; }
  .icon .badge { position: absolute; top: -3px; right: -3px; width: 13px; height: 13px; border-radius: 50%; background: var(--red); color: #fff; font-size: 7px; font-weight: 800; display: grid; place-items: center; }
  .btn { border: 1px solid var(--line); background: #121a16; color: var(--ink); border-radius: 7px; padding: 6px 9px; font-size: 10px; font-weight: 700; white-space: nowrap; }
  .btn:hover { border-color: #374151; }
  .btn.primary { background: var(--accent); border-color: transparent; color: #04130b; }
  .btn.primary:hover { background: #6ee7b7; }
  .btn.ghost { background: transparent; color: var(--muted); border-color: transparent; }
  .btn.ghost:hover { background: #121a16; color: var(--ink); }
  .btn.small { padding: 4px 7px; font-size: 9px; }
  .btn.danger { color: #fecdd3; border-color: #4c1d24; background: #1a0d10; }
  .btn[disabled] { opacity: .4; cursor: default; }

  .content { flex: 1; overflow: auto; padding: 18px 20px 40px; position: relative; }
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .page-head h1 { margin: 0; font-size: 20px; letter-spacing: -.03em; }
  .page-head p { margin: 3px 0 0; color: var(--soft); font-size: 10px; }
  .page-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; color: var(--soft); font-size: 10px; font-weight: 700; padding: 0; margin-bottom: 6px; }
  .back:hover { color: var(--ink); }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin-bottom: 10px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px; }
  .kpi .l { font-size: 8px; text-transform: uppercase; letter-spacing: .08em; color: var(--soft); font-weight: 800; }
  .kpi .v { font-size: 22px; font-weight: 800; letter-spacing: -.03em; margin-top: 4px; }
  .kpi .n { font-size: 9px; color: var(--soft); margin-top: 1px; }
  .kpi .n b { color: var(--accent); }

  .dash-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, .7fr); gap: 10px; align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .card-head b { font-size: 11px; }
  .card-head span { margin-left: auto; color: var(--soft); font-size: 8px; }
  .card-body { padding: 12px; }

  .table { width: 100%; border-collapse: collapse; }
  .table th { text-align: left; font-size: 8px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); padding: 8px 10px; border-bottom: 1px solid var(--line); background: #0d1210; font-weight: 800; }
  .table td { padding: 9px 10px; border-bottom: 1px solid #16201b; font-size: 10px; vertical-align: middle; }
  .table tr:last-child td { border-bottom: 0; }
  .table tbody tr:hover { background: #111a15; }
  .table tbody tr.clickable { cursor: pointer; }
  .table .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; color: var(--soft); }
  .table .strong { font-weight: 700; color: var(--ink); }
  .table .right { text-align: right; }

  .pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 6px; font-size: 8px; font-weight: 800; white-space: nowrap; }
  .pill.run { background: rgba(52,211,153,.12); color: #86efac; }
  .pill.done { background: rgba(34,211,238,.10); color: #67e8f9; }
  .pill.queued { background: rgba(251,191,36,.10); color: #fde68a; }
  .pill.lab { background: rgba(167,139,250,.12); color: #c4b5fd; }
  .pill.arch { background: #1a1a23; color: #a1a1aa; }
  .pill.warn { background: rgba(251,113,133,.12); color: #fda4af; }

  .chart { width: 100%; display: block; }
  .chart-wrap { padding: 8px 10px 4px; }
  .chart-legend { display: flex; gap: 12px; padding: 0 10px 8px; color: var(--soft); font-size: 8px; }
  .chart-legend span::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 2px; background: var(--accent); margin-right: 4px; vertical-align: middle; }
  .chart-legend .dim::before { background: #334155; }

  .activity { display: flex; flex-direction: column; gap: 9px; }
  .activity-row { display: flex; gap: 7px; align-items: flex-start; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-top: 4px; flex: none; }
  .dot.amber { background: var(--amber); }
  .dot.cyan { background: var(--accent2); }
  .activity-row div { font-size: 9px; color: var(--muted); }
  .activity-row b { color: var(--ink); font-weight: 600; }
  .activity-row small { display: block; color: var(--soft); font-size: 8px; margin-top: 1px; }

  .agent-card { background: linear-gradient(160deg, #11201a, #0f1512); }
  .agent-row { display: flex; gap: 8px; align-items: flex-start; }
  .orb { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(from 90deg,#22d3ee,#34d399,#a78bfa,#22d3ee); flex: none; box-shadow: 0 0 12px rgba(52,211,153,.35); }
  .agent-text { font-size: 9px; color: #d1fae5; background: #0f1f18; border: 1px solid #1f3b2c; border-radius: 8px; padding: 7px 8px; }
  .agent-actions { display: flex; gap: 5px; margin-top: 9px; }
  .agent-actions .btn { flex: 1; }

  /* Run detail */
  .run-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .run-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .run-title h1 { margin: 0; font-size: 20px; letter-spacing: -.03em; }
  .meta-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .meta { border: 1px solid var(--line); background: #0f1512; border-radius: 6px; padding: 3px 6px; font-size: 8px; color: var(--muted); }
  .meta b { color: var(--ink); }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .tab { border: 0; background: transparent; color: var(--soft); font-size: 10px; font-weight: 700; padding: 7px 9px 9px; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }

  .cand-grid { display: grid; grid-template-columns: 260px minmax(0,1fr) 300px; gap: 9px; align-items: start; }
  .cand-list { max-height: 520px; overflow: auto; }
  .cand-row { display: grid; grid-template-columns: 24px minmax(0,1fr) 46px; gap: 7px; align-items: center; border-bottom: 1px solid #16201b; padding: 7px 9px; cursor: pointer; }
  .cand-row:hover { background: #111a15; }
  .cand-row.active { background: #14251c; border-left: 2px solid var(--accent); }
  .cand-rank { font-size: 8px; color: var(--soft); font-weight: 800; }
  .cand-name { font-size: 9px; font-weight: 700; }
  .cand-sub { font-size: 8px; color: var(--soft); margin-top: 1px; }
  .cand-yield { text-align: right; font-size: 10px; font-weight: 800; color: var(--accent); }
  .cand-yield small { display: block; font-size: 7px; color: var(--soft); font-weight: 600; }

  .run-chart { padding: 10px; }
  .run-metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 0 10px 10px; }
  .run-metric { border: 1px solid var(--line); border-radius: 7px; padding: 7px; background: #0d1210; }
  .run-metric b { display: block; font-size: 15px; font-weight: 800; }
  .run-metric span { display: block; font-size: 8px; color: var(--soft); margin-top: 1px; }

  .cand-detail { padding: 11px; }
  .cand-detail h3 { margin: 0; font-size: 15px; letter-spacing: -.02em; }
  .cand-detail .sub { color: var(--soft); font-size: 8px; margin-top: 2px; }
  .big-yield { display: flex; align-items: baseline; gap: 6px; margin-top: 10px; }
  .big-yield b { font-size: 30px; font-weight: 800; letter-spacing: -.04em; color: var(--accent); }
  .big-yield span { font-size: 8px; color: var(--soft); }
  .factor-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .factor { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid #16201b; padding-bottom: 5px; font-size: 9px; }
  .factor span { color: var(--soft); }
  .factor b { font-weight: 700; }
  .detail-actions { display: flex; gap: 5px; margin-top: 11px; }
  .detail-actions .btn { flex: 1; }

  .results-grid { display: grid; grid-template-columns: minmax(0,1.2fr) minmax(280px,.8fr); gap: 10px; align-items: start; }
  .summary-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; margin-bottom: 10px; }
  .summary { border: 1px solid var(--line); border-radius: 8px; padding: 9px; background: #0d1210; }
  .summary b { display: block; font-size: 18px; font-weight: 800; }
  .summary span { display: block; font-size: 8px; color: var(--soft); }
  .recommend { border-left: 2px solid var(--accent); background: #0f1f18; border-radius: 0 8px 8px 0; padding: 9px 11px; font-size: 9px; color: #d1fae5; }
  .recommend b { color: #fff; }

  .protocol { max-width: 760px; background: #f8fafc; color: #0f172a; border-radius: 8px; padding: 28px 32px; font-size: 11px; line-height: 1.6; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .protocol h2 { margin: 0 0 3px; font-size: 18px; letter-spacing: -.02em; }
  .protocol .sub { color: #64748b; font-size: 9px; margin-bottom: 18px; }
  .protocol h4 { margin: 18px 0 6px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #475569; }
  .protocol table { width: 100%; border-collapse: collapse; margin: 6px 0 12px; }
  .protocol th, .protocol td { text-align: left; border-bottom: 1px solid #e2e8f0; padding: 5px 6px; font-size: 10px; }
  .protocol th { color: #64748b; font-size: 8px; text-transform: uppercase; }
  .protocol code { background: #e2e8f0; padding: 1px 4px; border-radius: 3px; font-size: 9px; }

  .log { display: flex; flex-direction: column; gap: 7px; }
  .log-row { display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 7px; align-items: start; }
  .log-badge { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 8px; font-weight: 800; background: #16231c; color: #86efac; }
  .log-badge.npu { background: rgba(251,191,36,.1); color: #fde68a; }
  .log-badge.tool { background: #1a1a23; color: #a1a1aa; }
  .log-text { border: 1px solid var(--line); background: #0d1210; border-radius: 7px; padding: 6px 8px; font-size: 9px; color: var(--muted); }
  .log-text b { color: var(--ink); }
  .log-text small { display: block; color: var(--soft); font-size: 8px; margin-top: 2px; }

  .progress-card { padding: 18px; }
  .progress-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .progress-head b { font-size: 14px; }
  .progress-head span { color: var(--soft); font-size: 9px; }
  .progress-bar { height: 5px; background: #1a2a22; border-radius: 999px; overflow: hidden; margin-top: 10px; }
  .progress-bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#22d3ee,#34d399); border-radius: 999px; transition: width .35s; }
  .progress-log { margin-top: 14px; display: flex; flex-direction: column; gap: 5px; }
  .progress-log div { font-size: 9px; color: var(--muted); font-family: ui-monospace, monospace; }
  .progress-log div::before { content: "> "; color: #34d399; }

  .empty { padding: 30px; text-align: center; color: var(--soft); font-size: 10px; }

  /* Wizard modal */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.78); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 40; padding: 24px; }
  .modal.open { display: flex; }
  .wizard { width: min(760px, 100%); background: #0f1512; border: 1px solid #2a3a31; border-radius: 14px; box-shadow: 0 30px 90px rgba(0,0,0,.5); overflow: hidden; }
  .wizard-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .wizard-head b { font-size: 14px; }
  .wizard-steps { display: flex; gap: 5px; padding: 10px 18px 0; }
  .wstep { flex: 1; height: 3px; background: #1f2a24; border-radius: 999px; }
  .wstep.active { background: var(--accent); }
  .wizard-body { padding: 16px 18px; min-height: 300px; }
  .wizard-body h3 { margin: 0 0 3px; font-size: 15px; letter-spacing: -.02em; }
  .wizard-body p.sub { margin: 0 0 14px; color: var(--soft); font-size: 9px; }
  .choice-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; }
  .choice { border: 1px solid var(--line); background: #0d1210; border-radius: 8px; padding: 10px; text-align: left; color: var(--muted); }
  .choice:hover { border-color: #2f6b4f; }
  .choice.active { border-color: var(--accent); background: #102019; color: var(--ink); }
  .choice b { display: block; font-size: 10px; color: var(--ink); }
  .choice span { display: block; font-size: 8px; color: var(--soft); margin-top: 3px; }
  .field { margin-top: 12px; }
  .field label { display: block; font-size: 8px; text-transform: uppercase; letter-spacing: .08em; color: var(--soft); font-weight: 800; margin-bottom: 4px; }
  .field input, .field select { width: 100%; border: 1px solid var(--line); background: #0d1210; color: var(--ink); border-radius: 6px; padding: 7px 8px; font-size: 10px; outline: none; }
  .field input:focus, .field select:focus { border-color: #2f6b4f; }
  .factor-editor { display: grid; grid-template-columns: 1fr 90px 90px; gap: 7px; align-items: center; border-bottom: 1px solid #16201b; padding: 6px 0; font-size: 9px; }
  .factor-editor span { color: var(--muted); }
  .factor-editor input { border: 1px solid var(--line); background: #0d1210; color: var(--ink); border-radius: 5px; padding: 4px 6px; font-size: 9px; outline: none; }
  .wizard-foot { display: flex; justify-content: space-between; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
  .review-list { display: flex; flex-direction: column; gap: 7px; }
  .review-row { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid #16201b; padding-bottom: 6px; font-size: 9px; }
  .review-row span { color: var(--soft); }
  .review-row b { text-align: right; }

  /* Agent drawer */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 360px; background: #0d1210; border-left: 1px solid #2a3a31; transform: translateX(100%); transition: .25s; z-index: 35; display: flex; flex-direction: column; box-shadow: -20px 0 60px rgba(0,0,0,.35); }
  .drawer.open { transform: none; }
  .drawer-head { display: flex; align-items: center; gap: 8px; padding: 13px; border-bottom: 1px solid var(--line); }
  .drawer-head b { font-size: 11px; }
  .drawer-head span { margin-left: auto; color: var(--soft); font-size: 8px; }
  .drawer-log { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .bubble { border-radius: 8px; padding: 8px; font-size: 9px; line-height: 1.5; max-width: 92%; }
  .bubble.agent { background: #102019; border: 1px solid #1f3b2c; color: #d1fae5; align-self: flex-start; }
  .bubble.user { background: #1e2a3a; color: #dbeafe; align-self: flex-end; }
  .drawer-foot { padding: 10px; border-top: 1px solid var(--line); display: flex; gap: 6px; }
  .drawer-foot input { flex: 1; border: 1px solid var(--line); background: #0d1210; color: var(--ink); border-radius: 6px; padding: 7px; font-size: 9px; outline: none; }
  .drawer-foot input:focus { border-color: #2f6b4f; }
  .drawer-foot button { border: 0; background: var(--accent); color: #04130b; border-radius: 6px; padding: 0 9px; font-size: 9px; font-weight: 800; }

  .toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%,16px); background: #112019; border: 1px solid #2a4a38; color: #d1fae5; font-size: 10px; font-weight: 600; padding: 8px 12px; border-radius: 7px; opacity: 0; pointer-events: none; transition: .25s; z-index: 70; }
  .toast.show { opacity: 1; transform: translate(-50%,0); }
  .toast.warn { border-color: #6b4a12; color: #fde68a; }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @media (max-width: 1100px) { .cand-grid { grid-template-columns: 220px minmax(0,1fr); } .cand-detail { grid-column: 1 / -1; } .dash-grid { grid-template-columns: 1fr; } }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } .sidebar { display: none; } .search { display: none; } .kpis { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="mark"></div><div><b>Lab Loop</b><span>Formulation studio</span></div></div>
    <div class="project"><div class="project-dot"></div><div><b>Helios</b><small>Battery electrolyte</small></div></div>
    <div>
      <div class="nav-label">Workspace</div>
      <nav class="nav" id="nav"></nav>
    </div>
    <div class="sidefoot">
      <div class="agent-state"><span class="pulse"></span> Agent online | NPU 4</div>
      <div class="user"><div class="avatar">MC</div><div><b>M. Chen</b><small>Formulation scientist</small></div></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumb"><b>Helios</b><span class="sep">/</span><span id="crumb">Runs</span></div>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="globalSearch" placeholder="Search runs, batches, formulations..."></div>
      <div class="top-actions">
        <button class="icon" title="Agent" data-action="open-agent"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></svg></button>
        <button class="icon" title="Notifications" data-action="toast" data-message="No unread notifications."><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span class="badge">2</span></button>
        <button class="btn primary" data-action="new-analysis">+ New analysis</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal" id="modal"><div id="modalBody"></div></div>
<div class="drawer" id="drawer">
  <div class="drawer-head"><div class="orb"></div><b>Lab agent</b><span>NPU online</span><button class="btn ghost" data-action="close-agent">x</button></div>
  <div class="drawer-log" id="drawerLog"></div>
  <div class="drawer-foot"><input id="drawerInput" placeholder="Ask about a run, candidate or result..."><button data-action="send-agent">Ask</button></div>
</div>
<div class="toast" id="toast"></div>

<script>
  const RUNS = [
    {
      id: "R-105",
      name: "Yield optimization | Batch 05",
      intent: "Maximize yield",
      status: "completed",
      model: "Surrogate v3",
      npu: "NPU 4",
      created: "Today 15:10",
      candidates: null,
      best: null,
      logs: []
    },
    {
      id: "R-104",
      name: "Purity optimization | Batch 04",
      intent: "Maximize purity",
      status: "completed",
      model: "Surrogate v3",
      npu: "NPU 4",
      created: "Today 11:32",
      candidates: null,
      best: "94.1%",
      logs: []
    },
    {
      id: "R-103",
      name: "Cost reduction | Batch 03",
      intent: "Minimize cost",
      status: "completed",
      model: "Physics sim",
      npu: "NPU 4",
      created: "Yesterday 16:05",
      candidates: null,
      best: "12.4% lower",
      logs: []
    },
    {
      id: "R-102",
      name: "Yield optimization | Batch 02",
      intent: "Maximize yield",
      status: "archived",
      model: "Surrogate v2",
      npu: "NPU 2",
      created: "2 days ago",
      candidates: null,
      best: "68.0%",
      logs: []
    }
  ];

  const BATCHES = [
    { id: "B-05", run: "R-105", name: "Yield batch 05", status: "Queued", candidates: 5, result: "-", created: "Today 15:12" },
    { id: "B-04", run: "R-104", name: "Purity batch 04", status: "In lab", candidates: 5, result: "-", created: "Today 11:35" },
    { id: "B-03", run: "R-103", name: "Yield batch 03", status: "Done", candidates: 5, result: "71.2%", created: "Yesterday 16:20" },
    { id: "B-02", run: "R-102", name: "Yield batch 02", status: "Done", candidates: 5, result: "68.0%", created: "2 days ago" },
    { id: "B-01", run: "R-101", name: "Yield batch 01", status: "Done", candidates: 5, result: "61.4%", created: "3 days ago" }
  ];

  const DATA_ROWS = [
    { id: "E-024", date: "Today", expr: "LiFSI 1.2M | EC/DMC", temp: "25C", time: "24h", yield: "71.2%", batch: "B-03" },
    { id: "E-023", date: "Today", expr: "LiFSI 1.1M | EC/DEC", temp: "25C", time: "24h", yield: "69.8%", batch: "B-03" },
    { id: "E-022", date: "Yesterday", expr: "LiPF6 1.0M | EC/DMC", temp: "30C", time: "24h", yield: "68.0%", batch: "B-02" },
    { id: "E-021", date: "Yesterday", expr: "LiFSI 0.9M | EC/DMC", temp: "25C", time: "20h", yield: "66.4%", batch: "B-02" },
    { id: "E-020", date: "2 days ago", expr: "LiPF6 1.1M | EC/EMC", temp: "25C", time: "24h", yield: "64.1%", batch: "B-01" },
    { id: "E-019", date: "2 days ago", expr: "LiFSI 1.0M | PC", temp: "25C", time: "24h", yield: "61.4%", batch: "B-01" }
  ];

  const state = {
    view: "runs",
    runId: "R-105",
    candidateId: null,
    tab: "Candidates",
    batchId: null,
    wizard: { step: 0, objective: "yield", target: "72", data: "past", model: "Surrogate v3", npu: "NPU 4", count: 5000 },
    agentOpen: false,
    agentLog: [{ role: "agent", text: "I can help you design the next analysis, review candidates or explain a result." }],
    timers: {},
    runSeq: 106,
    batchSeq: 6
  };

  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));

  function makeCandidates(runId) {
    const arr = [];
    for (let i = 0; i < 24; i++) {
      const yieldVal = 63 + ((i * 1.37) % 8.5) + (i % 5 === 0 ? 1.1 : 0);
      arr.push({
        id: `F-${String(i + 1).padStart(2, "0")}`,
        polymer: (62 + (i % 7) * 0.9).toFixed(1),
        plasticizer: (12 + (i % 5) * 0.5).toFixed(1),
        temp: 168 + (i % 6) * 2,
        time: (24 + (i % 4) * 1.5).toFixed(1),
        yield: yieldVal,
        confidence: 0.93 - (i % 5) * 0.02,
        constraints: i % 11 === 0 ? "1 warning" : "Pass",
        score: 100 - i * 2.1
      });
    }
    return arr.sort((a, b) => b.yield - a.yield).map((c, i) => ({ ...c, rank: i + 1 }));
  }

  function runById(id) { return RUNS.find(r => r.id === id); }
  function selectedRun() { return runById(state.runId); }
  function selectedCandidate() {
    const r = selectedRun();
    if (!r || !r.candidates) return null;
    return r.candidates.find(c => c.id === state.candidateId) || r.candidates[0];
  }
  function batchById(id) { return BATCHES.find(b => b.id === id); }

  function toast(message, kind = "") {
    const el = $("#toast");
    el.textContent = message;
    el.className = "toast show " + kind;
    clearTimeout(window.__toast);
    window.__toast = setTimeout(() => { el.className = "toast"; }, 2600);
  }

  function ensureRunData() {
    RUNS.forEach(r => {
      if (!r.candidates && r.status === "completed") {
        r.candidates = makeCandidates(r.id);
        if (!r.best) r.best = r.candidates[0].yield.toFixed(1) + "%";
      }
      if (!r.logs) r.logs = [];
    });
  }

  function renderNav() {
    const activeRuns = RUNS.filter(r => r.status === "running").length;
    const pendingBatches = BATCHES.filter(b => b.status !== "Done").length;
    const items = [
      { id: "runs", label: "Runs", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5"/><path d="M4 19h16"/><path d="m7 15 4-4 3 3 5-6"/></svg>', count: activeRuns || 2 },
      { id: "batches", label: "Batches", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>', count: pendingBatches || 2 },
      { id: "data", label: "Data", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>' },
      { id: "models", label: "Models", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 4 7v10l8 4 8-4V7l-8-4Z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg>' },
      { id: "settings", label: "Settings", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 0 0-1.7-1L14.5 3h-5l-.4 3.1a7 7 0 0 0-1.7 1l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 1.7 1l.4 3.1h5l.4-3.1a7 7 0 0 0 1.7-1l2.3 1 2-3.4-2-1.5c.1-.3.1-.7.1-1Z"/></svg>' }
    ];
    $("#nav").innerHTML = items.map(i => `
      <button class="nav-item ${state.view === i.id ? "active" : ""}" data-view="${i.id}">
        ${i.icon}<span>${i.label}</span>${i.count ? `<span class="count">${i.count}</span>` : ""}
      </button>`).join("");
  }

  function renderTop() {
    const labels = { runs: "Runs", run: "Run", batches: "Batches", data: "Data", models: "Models", settings: "Settings" };
    $("#crumb").textContent = labels[state.view] || "Runs";
  }

  function render() {
    ensureRunData();
    renderNav();
    renderTop();
    const c = $("#content");
    if (state.view === "runs") c.innerHTML = runsHTML();
    else if (state.view === "run") c.innerHTML = runHTML();
    else if (state.view === "batches") c.innerHTML = batchesHTML();
    else if (state.view === "data") c.innerHTML = dataHTML();
    else if (state.view === "models") c.innerHTML = modelsHTML();
    else if (state.view === "settings") c.innerHTML = settingsHTML();
    bind();
  }

  function runsHTML() {
    const best = RUNS.filter(r => r.best).map(r => parseFloat(r.best)).filter(n => !isNaN(n));
    const bestVal = best.length ? Math.max(...best).toFixed(1) + "%" : "-";
    return `
      <div class="page-head">
        <div><h1>Runs</h1><p>Analysis runs, results and the next experiment</p></div>
        <div class="page-actions"><button class="btn primary" data-action="new-analysis">+ New analysis</button></div>
      </div>
      <div class="kpis">
        <div class="kpi"><div class="l">Active runs</div><div class="v">2</div><div class="n"><b>1</b> scoring now</div></div>
        <div class="kpi"><div class="l">Best yield</div><div class="v">${bestVal}</div><div class="n">last 30 days</div></div>
        <div class="kpi"><div class="l">Experiments</div><div class="v">12</div><div class="n">this week</div></div>
        <div class="kpi"><div class="l">NPU</div><div class="v">68%</div><div class="n">4 devices | 2 jobs</div></div>
      </div>
      <div class="dash-grid">
        <div class="stack">
          <div class="card">
            <div class="card-head"><b>Yield trend</b><span>last 5 batches</span></div>
            <div class="chart-wrap">${yieldTrend()}</div>
            <div class="chart-legend"><span>best yield</span><span class="dim">target 70%</span></div>
          </div>
          <div class="card">
            <div class="card-head"><b>All runs</b><span>${RUNS.length} runs</span></div>
            ${runsTable(RUNS)}
          </div>
        </div>
        <div class="stack">
          <div class="card agent-card">
            <div class="card-head"><div class="orb"></div><b>Next best action</b><span>agent</span></div>
            <div class="card-body">
              <div class="agent-row"><div class="orb"></div><div class="agent-text">Batch 03 hit 71.2% yield. I can start a new run around the top three formulations and test a narrower temperature window.</div></div>
              <div class="agent-actions"><button class="btn primary small" data-action="new-analysis">Start run</button><button class="btn small" data-action="open-agent">Ask why</button></div>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><b>Recent activity</b><span>today</span></div>
            <div class="card-body activity">
              <div class="activity-row"><span class="dot"></span><div><b>Batch 03 result entered</b><small>71.2% yield | 2h ago</small></div></div>
              <div class="activity-row"><span class="dot cyan"></span><div><b>R-104 completed</b><small>94.1% purity | 3h ago</small></div></div>
              <div class="activity-row"><span class="dot amber"></span><div><b>Batch 04 started</b><small>Purity batch | 4h ago</small></div></div>
            </div>
          </div>
        </div>
      </div>`;
  }

  function yieldTrend() {
    return `<svg class="chart" viewBox="0 0 620 190" role="img">
      <g stroke="#1f2a24" stroke-width="1"><path d="M40 160H600M40 120H600M40 80H600M40 40H600"/><path d="M40 160V20"/></g>
      <path d="M40 145 L150 132 L260 110 L370 82 L480 68 L590 55" fill="none" stroke="#34d399" stroke-width="3"/>
      <path d="M40 145 L150 132 L260 110 L370 82 L480 68 L590 55 L590 160 L40 160Z" fill="rgba(52,211,153,.08)"/>
      <g fill="#34d399"><circle cx="40" cy="145" r="4"/><circle cx="150" cy="132" r="4"/><circle cx="260" cy="110" r="4"/><circle cx="370" cy="82" r="4"/><circle cx="480" cy="68" r="4"/><circle cx="590" cy="55" r="5"/></g>
      <g fill="#6b7280" font-size="9" font-family="monospace"><text x="28" y="175">B01</text><text x="138" y="175">B02</text><text x="248" y="175">B03</text><text x="358" y="175">B04</text><text x="468" y="175">B05</text><text x="578" y="175">B06</text><text x="8" y="60">70%</text><text x="8" y="150">60%</text></g>
    </svg>`;
  }

  function runsTable(rows) {
    return `<table class="table"><thead><tr><th>Run</th><th>Intent</th><th>Status</th><th>Best</th><th>Model</th><th>Created</th><th></th></tr></thead><tbody>
      ${rows.map(r => `<tr class="clickable" data-run="${r.id}">
        <td><div class="strong">${r.name}</div><div class="mono">${r.id}</div></td>
        <td>${r.intent}</td>
        <td>${runPill(r.status)}</td>
        <td class="strong">${r.best || "-"}</td>
        <td>${r.model}</td>
        <td>${r.created}</td>
        <td class="right"><button class="btn small" data-run="${r.id}">Open</button></td>
      </tr>`).join("")}
    </tbody></table>`;
  }

  function runPill(status) {
    if (status === "running") return '<span class="pill run">Running</span>';
    if (status === "completed") return '<span class="pill done">Completed</span>';
    if (status === "archived") return '<span class="pill arch">Archived</span>';
    if (status === "batch_approved") return '<span class="pill lab">Batch approved</span>';
    return '<span class="pill queued">' + status + '</span>';
  }

  function runHTML() {
    const r = selectedRun();
    if (!r) return '<div class="empty">Run not found.</div>';
    if (r.status === "running") return runningHTML(r);
    if (!state.candidateId && r.candidates) state.candidateId = r.candidates[0].id;
    const tabs = ["Candidates", "Results", "Protocol", "Log"];
    let body = "";
    if (state.tab === "Candidates") body = candidatesHTML(r);
    else if (state.tab === "Results") body = resultsHTML(r);
    else if (state.tab === "Protocol") body = protocolHTML(r);
    else body = logHTML(r);
    return `
      <button class="back" data-view="runs"><- All runs</button>
      <div class="run-head">
        <div>
          <div class="run-title"><h1>${r.name}</h1>${runPill(r.status)}</div>
          <div class="meta-chips"><span class="meta"><b>${r.id}</b></span><span class="meta">${r.model}</span><span class="meta">${r.npu}</span><span class="meta">${r.created}</span><span class="meta">24 candidates</span></div>
        </div>
        <div class="page-actions">
          <button class="btn" data-action="export-protocol">Export protocol</button>
          <button class="btn primary" data-action="approve-batch">Approve batch</button>
        </div>
      </div>
      <div class="tabs">${tabs.map(t => `<button class="tab ${state.tab === t ? "active" : ""}" data-tab="${t}">${t}</button>`).join("")}</div>
      ${body}`;
  }

  function runningHTML(r) {
    return `
      <button class="back" data-view="runs"><- All runs</button>
      <div class="run-head"><div><div class="run-title"><h1>${r.name}</h1><span class="pill run">Running</span></div><div class="meta-chips"><span class="meta"><b>${r.id}</b></span><span class="meta">${r.model}</span><span class="meta">${r.npu}</span></div></div></div>
      <div class="card progress-card">
        <div class="progress-head"><b>Scoring candidates</b><span id="progressText">${r.progress || 0}%</span></div>
        <div class="progress-bar"><span id="progressBar" style="width:${r.progress || 0}%"></span></div>
        <div class="progress-log" id="progressLog">${(r.logs || []).slice(-6).map(l => `<div>${l}</div>`).join("") || "<div>Starting analysis...</div>"}</div>
      </div>`;
  }

  function candidatesHTML(r) {
    const c = selectedCandidate();
    return `
      <div class="cand-grid">
        <div class="card cand-list">
          <div class="card-head"><b>Ranked candidates</b><span>${r.candidates.length}</span></div>
          <div>
            ${r.candidates.slice(0, 12).map(cand => `
              <div class="cand-row ${cand.id === c.id ? "active" : ""}" data-candidate="${cand.id}">
                <div class="cand-rank">#${cand.rank}</div>
                <div><div class="cand-name">${cand.id} | ${cand.polymer}% polymer</div><div class="cand-sub">${cand.temp}C | ${cand.time}h | ${cand.constraints}</div></div>
                <div class="cand-yield">${cand.yield.toFixed(1)}%<small>yield</small></div>
              </div>`).join("")}
          </div>
        </div>
        <div>
          <div class="card">
            <div class="card-head"><b>Predicted yield</b><span>top 8 | target 72%</span></div>
            <div class="run-chart">${candidateChart(r, c.id)}</div>
            <div class="run-metrics">
              <div class="run-metric"><b>${c.yield.toFixed(1)}%</b><span>selected yield</span></div>
              <div class="run-metric"><b>${Math.round(c.confidence * 100)}%</b><span>confidence</span></div>
              <div class="run-metric"><b>${c.constraints === "Pass" ? "All pass" : "1 warning"}</b><span>constraints</span></div>
            </div>
          </div>
          <div class="card" style="margin-top:9px">
            <div class="card-head"><b>Why this candidate</b><span>agent</span></div>
            <div class="card-body">
              <div class="recommend"><b>${c.id} is the best balance.</b> It is predicted at ${c.yield.toFixed(1)}% with ${Math.round(c.confidence * 100)}% confidence. The temperature is inside the safe window and the model saw this region in 6 past experiments.</div>
              <div style="display:flex;gap:5px;margin-top:8px"><button class="btn small" data-action="add-to-batch">Add to batch</button><button class="btn small" data-action="open-agent">Ask agent</button></div>
            </div>
          </div>
        </div>
        <div class="card cand-detail">
          <h3>${c.id}</h3>
          <div class="sub">Candidate rank #${c.rank} | ${r.model}</div>
          <div class="big-yield"><b>${c.yield.toFixed(1)}%</b><span>predicted yield</span></div>
          <div class="factor-list">
            <div class="factor"><span>Polymer</span><b>${c.polymer}%</b></div>
            <div class="factor"><span>Plasticizer</span><b>${c.plasticizer}%</b></div>
            <div class="factor"><span>Temperature</span><b>${c.temp}C</b></div>
            <div class="factor"><span>Time</span><b>${c.time}h</b></div>
            <div class="factor"><span>Constraints</span><b>${c.constraints}</b></div>
            <div class="factor"><span>Model confidence</span><b>${Math.round(c.confidence * 100)}%</b></div>
          </div>
          <div class="detail-actions"><button class="btn primary" data-action="add-to-batch">Add to batch</button><button class="btn" data-action="open-agent">Ask</button></div>
        </div>
      </div>`;
  }

  function candidateChart(r, selectedId) {
    const top = r.candidates.slice(0, 8);
    const max = 80;
    return `<svg class="chart" viewBox="0 0 680 190" role="img">
      <g stroke="#1f2a24" stroke-width="1"><path d="M30 160H660M30 120H660M30 80H660M30 40H660"/></g>
      <path d="M30 72 H660" stroke="#fbbf24" stroke-width="1" stroke-dasharray="5 5" opacity=".7"/>
      <text x="668" y="75" fill="#fbbf24" font-size="8" font-family="monospace">72%</text>
      ${top.map((c, i) => {
        const h = (c.yield / max) * 130;
        const x = 55 + i * 76;
        const active = c.id === selectedId;
        return `<rect x="${x}" y="${160 - h}" width="36" height="${h}" rx="4" fill="${active ? "#34d399" : "#164e3a"}" opacity="${active ? 1 : .8}"/>
          <text x="${x + 18}" y="178" text-anchor="middle" fill="#6b7280" font-size="8" font-family="monospace">${c.id}</text>
          <text x="${x + 18}" y="${155 - h}" text-anchor="middle" fill="${active ? "#a7f3d0" : "#86efac"}" font-size="8" font-family="monospace">${c.yield.toFixed(1)}</text>`;
      }).join("")}
    </svg>`;
  }

  function resultsHTML(r) {
    const best = r.candidates[0];
    const pass = r.candidates.filter(c => c.constraints === "Pass").length;
    return `
      <div class="summary-row">
        <div class="summary"><b>${best.yield.toFixed(1)}%</b><span>best predicted yield</span></div>
        <div class="summary"><b>${r.candidates.length}</b><span>candidates scored</span></div>
        <div class="summary"><b>${pass}</b><span>constraints pass</span></div>
        <div class="summary"><b>4m 12s</b><span>run time on NPU</span></div>
      </div>
      <div class="results-grid">
        <div class="card"><div class="card-head"><b>Top candidates</b><span>predicted yield</span></div><div class="run-chart">${candidateChart(r, best.id)}</div>${runsTable(r.candidates.slice(0,5).map(c => ({ id: c.id, name: c.id + " | " + c.polymer + "% polymer", intent: c.temp + "C | " + c.time + "h", status: "completed", best: c.yield.toFixed(1) + "%", model: r.model, created: c.constraints })))}</div>
        <div class="card"><div class="card-head"><b>Agent recommendation</b><span>ready</span></div><div class="card-body"><div class="recommend"><b>Approve a batch of 5.</b> The top five candidates are inside the temperature window. ${best.id} is the highest predicted yield; ${r.candidates[4].id} is the diversity pick. I would run both.</div><div class="detail-actions" style="margin-top:10px"><button class="btn primary" data-action="approve-batch">Approve batch</button><button class="btn" data-action="open-agent">Ask why</button></div></div></div>
      </div>`;
  }

  function protocolHTML(r) {
    const top = r.candidates.slice(0, 5);
    return `
      <div class="protocol">
        <h2>Experiment protocol</h2>
        <div class="sub">${r.name} | ${r.model} | generated ${r.created}</div>
        <h4>Objective</h4>
        <p>Maximize yield while keeping temperature between 165C and 178C and time between 22h and 30h.</p>
        <h4>Materials</h4>
        <table><tr><th>Material</th><th>Amount</th><th>Note</th></tr>
          <tr><td>Base electrolyte</td><td>50 mL</td><td>Lot HE-2418</td></tr>
          <tr><td>Additive A</td><td>1.2 wt%</td><td>Dry box</td></tr>
          <tr><td>Additive B</td><td>0.8 wt%</td><td>Dry box</td></tr>
        </table>
        <h4>Candidates</h4>
        <table><tr><th>ID</th><th>Polymer</th><th>Plasticizer</th><th>Temp</th><th>Time</th><th>Predicted yield</th></tr>
          ${top.map(c => `<tr><td>${c.id}</td><td>${c.polymer}%</td><td>${c.plasticizer}%</td><td>${c.temp}C</td><td>${c.time}h</td><td>${c.yield.toFixed(1)}%</td></tr>`).join("")}
        </table>
        <h4>Steps</h4>
        <p>1. Prepare the base electrolyte under argon. 2. Add additives at 25C. 3. Seal and age for 24h. 4. Measure yield with the standard assay. 5. Enter the result in Lab Loop.</p>
        <h4>Safety</h4>
        <p>Use the dry box and gloves. Do not exceed 180C. Dispose of waste in the halogen-free stream.</p>
      </div>`;
  }

  function logHTML(r) {
    const logs = [
      { type: "agent", title: "Read the objective and constraints", detail: "Maximize yield; temperature 165-178C; time 22-30h.", time: "15:10" },
      { type: "tool", title: "Loaded 24 prior experiments", detail: "Helios Q3 dataset and two literature priors.", time: "15:10" },
      { type: "npu", title: "Scored 5,000 candidates", detail: "Surrogate v3 on NPU 4; 4m 12s.", time: "15:14" },
      { type: "agent", title: "Ranked the candidates", detail: "Top five pass constraints; two diversity picks added.", time: "15:15" },
      { type: "human", title: "Scientist approval pending", detail: "Approve a batch to send it to the lab.", time: "15:15" }
    ];
    return `<div class="card"><div class="card-head"><b>Run log</b><span>${r.id}</span></div><div class="card-body log">
      ${logs.map(l => `<div class="log-row"><div class="log-badge ${l.type}">${l.type === "npu" ? "N" : l.type === "tool" ? "T" : l.type === "human" ? "H" : "A"}</div><div class="log-text"><b>${l.title}</b><small>${l.detail}</small></div></div>`).join("")}
    </div></div>`;
  }

  function batchesHTML() {
    return `
      <div class="page-head"><div><h1>Batches</h1><p>Experiments sent to the lab and their results</p></div><div class="page-actions"><button class="btn primary" data-action="new-analysis">+ New analysis</button></div></div>
      <div class="card">
        <div class="card-head"><b>All batches</b><span>${BATCHES.length}</span></div>
        <table class="table"><thead><tr><th>Batch</th><th>Run</th><th>Status</th><th>Candidates</th><th>Result</th><th>Created</th><th></th></tr></thead><tbody>
          ${BATCHES.map(b => `<tr class="clickable">
            <td><div class="strong">${b.name}</div><div class="mono">${b.id}</div></td>
            <td>${b.run}</td>
            <td>${batchPill(b.status)}</td>
            <td>${b.candidates}</td>
            <td class="strong">${b.result}</td>
            <td>${b.created}</td>
            <td class="right">${b.status === "In lab" || b.status === "Queued" ? `<button class="btn small" data-result="${b.id}">Enter result</button>` : `<button class="btn small" data-result="${b.id}">View</button>`}</td>
          </tr>`).join("")}
        </tbody></table>
      </div>`;
  }

  function batchPill(status) {
    if (status === "Done") return '<span class="pill done">Done</span>';
    if (status === "In lab") return '<span class="pill lab">In lab</span>';
    return '<span class="pill queued">Queued</span>';
  }

  function dataHTML() {
    return `
      <div class="page-head"><div><h1>Data</h1><p>Past experiments and measured results</p></div><div class="page-actions"><button class="btn" data-action="import-csv">Import CSV</button><button class="btn primary" data-action="new-analysis">+ New analysis</button></div></div>
      <div class="card"><div class="card-head"><b>Experiments</b><span>${DATA_ROWS.length} rows</span></div>
        <table class="table"><thead><tr><th>ID</th><th>Date</th><th>Formulation</th><th>Temp</th><th>Time</th><th>Yield</th><th>Batch</th></tr></thead><tbody>
          ${DATA_ROWS.map(d => `<tr><td class="mono">${d.id}</td><td>${d.date}</td><td>${d.expr}</td><td>${d.temp}</td><td>${d.time}</td><td class="strong">${d.yield}</td><td>${d.batch}</td></tr>`).join("")}
        </tbody></table>
      </div>`;
  }

  function modelsHTML() {
    return `
      <div class="page-head"><div><h1>Models</h1><p>Surrogate models, simulators and NPU resources</p></div><div class="page-actions"><button class="btn" data-action="retrain">Retrain model</button></div></div>
      <div class="dash-grid">
        <div class="card"><div class="card-head"><b>Surrogate v3</b><span>active</span></div><div class="card-body">
          <div class="summary-row" style="grid-template-columns:repeat(3,1fr)"><div class="summary"><b>0.94</b><span>R2</span></div><div class="summary"><b>1.8%</b><span>MAE</span></div><div class="summary"><b>24</b><span>experiments</span></div></div>
          <p style="color:var(--muted);font-size:9px">Trained on 24 Helios experiments and 120 literature priors. Last retrained today 14:10.</p>
        </div></div>
        <div class="card"><div class="card-head"><b>NPU 4</b><span>online</span></div><div class="card-body">
          <div class="summary-row" style="grid-template-columns:repeat(2,1fr)"><div class="summary"><b>68%</b><span>utilization</span></div><div class="summary"><b>4</b><span>devices</span></div></div>
          <p style="color:var(--muted);font-size:9px">2 jobs running. Average inference 12 ms per candidate.</p>
        </div></div>
      </div>`;
  }

  function settingsHTML() {
    return `
      <div class="page-head"><div><h1>Settings</h1><p>Defaults for Helios analyses</p></div><div class="page-actions"><button class="btn primary" data-action="toast" data-message="Settings saved.">Save</button></div></div>
      <div class="card"><div class="card-body">
        <div class="field"><label>Default objective</label><select><option>Maximize yield</option><option>Minimize cost</option><option>Maximize purity</option></select></div>
        <div class="field"><label>Default model</label><select><option>Surrogate v3</option><option>Physics simulator</option></select></div>
        <div class="field"><label>NPU pool</label><select><option>NPU 4</option><option>NPU 2</option></select></div>
        <div class="field"><label>Candidate budget per run</label><input value="5000"></div>
      </div></div>`;
  }

  function wizardHTML() {
    const w = state.wizard;
    const steps = ["Goal", "Data", "Search space", "Review"];
    let body = "";
    if (w.step === 0) {
      body = `<h3>What should the analysis optimize?</h3><p class="sub">The agent uses this to rank candidates and explain the trade-offs.</p>
        <div class="choice-grid">
          ${[["yield","Maximize yield","Best predicted result"],["cost","Minimize cost","Cheaper formulation"],["purity","Maximize purity","Cleaner output"]].map(([id,label,desc]) => `<button class="choice ${w.objective===id?"active":""}" data-wizard-choice="objective" data-value="${id}"><b>${label}</b><span>${desc}</span></button>`).join("")}
        </div>
        <div class="field"><label>Target</label><input id="targetInput" value="${w.target}" placeholder="e.g. 72"></div>
        <div class="field"><label>Constraints</label><input value="Temperature 165-178C | Time 22-30h | Additive A max 1.5 wt%"></div>`;
    } else if (w.step === 1) {
      body = `<h3>What should the agent learn from?</h3><p class="sub">Past experiments and a model give the agent a starting point.</p>
        <div class="choice-grid">
          ${[["past","Past experiments","24 Helios runs"],["literature","Literature","120 priors"],["simulator","Physics simulator","First principles"]].map(([id,label,desc]) => `<button class="choice ${w.data===id?"active":""}" data-wizard-choice="data" data-value="${id}"><b>${label}</b><span>${desc}</span></button>`).join("")}
        </div>
        <div class="field"><label>Model</label><select id="modelSelect"><option>Surrogate v3</option><option>Surrogate v2</option><option>Physics simulator</option></select></div>
        <div class="field"><label>Compute</label><select id="npuSelect"><option>NPU 4</option><option>NPU 2</option></select></div>`;
    } else if (w.step === 2) {
      body = `<h3>How wide should the search be?</h3><p class="sub">Narrow ranges are faster; wide ranges find more surprising candidates.</p>
        <div class="factor-editor"><span>Polymer %</span><input value="60"><input value="70"><small style="color:var(--soft);font-size:8px">min / max</small></div>
        <div class="factor-editor"><span>Plasticizer %</span><input value="10"><input value="16"><small style="color:var(--soft);font-size:8px">min / max</small></div>
        <div class="factor-editor"><span>Temperature C</span><input value="165"><input value="178"><small style="color:var(--soft);font-size:8px">min / max</small></div>
        <div class="factor-editor"><span>Time h</span><input value="22"><input value="30"><small style="color:var(--soft);font-size:8px">min / max</small></div>
        <div class="field"><label>Candidates to score</label><input id="countInput" value="${w.count}"></div>`;
    } else {
      body = `<h3>Ready to run</h3><p class="sub">The agent will score candidates on the NPU and return a ranked batch.</p>
        <div class="review-list">
          <div class="review-row"><span>Objective</span><b>${w.objective === "yield" ? "Maximize yield" : w.objective === "cost" ? "Minimize cost" : "Maximize purity"}</b></div>
          <div class="review-row"><span>Target</span><b>${w.target}%</b></div>
          <div class="review-row"><span>Data</span><b>${w.data === "past" ? "Past experiments" : w.data === "literature" ? "Literature" : "Physics simulator"}</b></div>
          <div class="review-row"><span>Model</span><b>${w.model}</b></div>
          <div class="review-row"><span>Compute</span><b>${w.npu}</b></div>
          <div class="review-row"><span>Candidates</span><b>${w.count}</b></div>
        </div>`;
    }
    return `<div class="wizard">
      <div class="wizard-head"><b>New analysis</b><button class="btn ghost" data-action="close-modal">x</button></div>
      <div class="wizard-steps">${steps.map((_, i) => `<div class="wstep ${i <= w.step ? "active" : ""}"></div>`).join("")}</div>
      <div class="wizard-body">${body}</div>
      <div class="wizard-foot">
        <button class="btn" data-action="wizard-back" ${w.step === 0 ? "disabled" : ""}>Back</button>
        <div style="display:flex;gap:6px">
          <span style="color:var(--soft);font-size:9px;align-self:center">Step ${w.step + 1} of 4</span>
          ${w.step === 3 ? `<button class="btn primary" data-action="start-analysis">Start analysis</button>` : `<button class="btn primary" data-action="wizard-next">Next -></button>`}
        </div>
      </div>
    </div>`;
  }

  function openWizard() {
    state.wizard = { step: 0, objective: "yield", target: "72", data: "past", model: "Surrogate v3", npu: "NPU 4", count: 5000 };
    $("#modalBody").innerHTML = wizardHTML();
    $("#modal").classList.add("open");
  }

  function updateWizard() {
    $("#modalBody").innerHTML = wizardHTML();
    bindWizard();
  }

  function bindWizard() {
    const target = $("#targetInput"); if (target) target.addEventListener("input", e => { state.wizard.target = e.target.value; });
    const count = $("#countInput"); if (count) count.addEventListener("input", e => { state.wizard.count = e.target.value; });
    const model = $("#modelSelect"); if (model) model.addEventListener("change", e => { state.wizard.model = e.target.value; });
    const npu = $("#npuSelect"); if (npu) npu.addEventListener("change", e => { state.wizard.npu = e.target.value; });
  }

  function startAnalysis() {
    const seq = state.runSeq++;
    const id = "R-" + seq;
    const batchNo = String(seq - 100).padStart(2, "0");
    const run = {
      id,
      name: (state.wizard.objective === "yield" ? "Yield optimization" : state.wizard.objective === "cost" ? "Cost reduction" : "Purity optimization") + " | Batch " + batchNo,
      intent: state.wizard.objective,
      status: "running",
      model: state.wizard.model,
      npu: state.wizard.npu,
      created: "Just now",
      progress: 0,
      logs: ["Objective received", "Loading past experiments", "Preparing 5,000 candidates"],
      candidates: null,
      best: null
    };
    RUNS.unshift(run);
    state.runId = run.id;
    state.view = "run";
    state.tab = "Candidates";
    $("#modal").classList.remove("open");
    render();
    startProgress(run);
  }

  function startProgress(run) {
    const steps = [
      "Loaded 24 past experiments",
      "Scored 1,200 candidates on NPU",
      "Scored 2,800 candidates on NPU",
      "Constraint check complete",
      "Ranking top candidates",
      "Run complete"
    ];
    let tick = 0;
    state.timers[run.id] = setInterval(() => {
      run.progress = Math.min(100, run.progress + 16);
      if (steps[tick]) run.logs.push(steps[tick]);
      tick++;
      if (run.progress >= 100) {
        run.status = "completed";
        run.candidates = makeCandidates(run.id);
        run.best = run.candidates[0].yield.toFixed(1) + "%";
        state.candidateId = run.candidates[0].id;
        clearInterval(state.timers[run.id]);
        delete state.timers[run.id];
        if (state.view === "run" && state.runId === run.id) render();
        if (state.view === "runs") render();
        toast("Analysis complete. 24 candidates ranked.", "ok");
      } else {
        if (state.view === "run" && state.runId === run.id) render();
        if (state.view === "runs") render();
      }
    }, 650);
  }

  function approveBatch() {
    const r = selectedRun();
    if (!r || !r.candidates) return;
    const id = "B-" + String(state.batchSeq++).padStart(2, "0");
    BATCHES.unshift({ id, run: r.id, name: r.name.split(" | ")[0] + " batch " + id.slice(-2), status: "Queued", candidates: 5, result: "-", created: "Just now" });
    r.status = "batch_approved";
    render();
    toast("Batch " + id + " created. Five candidates sent to the lab.", "ok");
  }

  function openResult(batchId) {
    const b = batchById(batchId);
    if (!b) return;
    $("#modalBody").innerHTML = `<div class="wizard">
      <div class="wizard-head"><b>Enter result | ${b.id}</b><button class="btn ghost" data-action="close-modal">x</button></div>
      <div class="wizard-body">
        <h3>${b.name}</h3><p class="sub">Measured yield for the batch. This updates the model.</p>
        <div class="field"><label>Measured yield (%)</label><input id="resultYield" value="71.8"></div>
        <div class="field"><label>Notes</label><input value="Standard assay, 24h, no anomalies."></div>
      </div>
      <div class="wizard-foot"><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-result" data-batch="${b.id}">Save result</button></div>
    </div>`;
    $("#modal").classList.add("open");
  }

  function saveResult(batchId) {
    const b = batchById(batchId);
    const val = $("#resultYield") ? $("#resultYield").value : "71.8";
    if (b) { b.status = "Done"; b.result = val + "%"; }
    $("#modal").classList.remove("open");
    render();
    toast("Result saved. Model retrained on the new experiment.", "ok");
  }

  function bind() {
    const gs = $("#globalSearch");
    if (gs) gs.addEventListener("input", e => {
      const q = e.target.value.toLowerCase();
      if (!q) return;
      const run = RUNS.find(r => r.name.toLowerCase().includes(q) || r.id.toLowerCase().includes(q));
      if (run) { state.runId = run.id; state.view = "run"; state.tab = "Candidates"; render(); }
    });
  }

  function openAgent(prompt) {
    state.agentOpen = true;
    $("#drawer").classList.add("open");
    if (prompt) sendAgent(prompt);
    else renderAgent();
  }

  function renderAgent() {
    $("#drawerLog").innerHTML = state.agentLog.map(m => `<div class="bubble ${m.role}">${m.text}</div>`).join("");
    const log = $("#drawerLog"); if (log) log.scrollTop = log.scrollHeight;
  }

  function sendAgent(text) {
    const value = (text || "").trim();
    if (!value) return;
    state.agentLog.push({ role: "user", text: value });
    renderAgent();
    setTimeout(() => {
      let reply = "I would start with the top three candidates from R-105. They pass constraints and sit inside the temperature window.";
      if (value.toLowerCase().includes("why")) reply = "The top candidate has 71.8% predicted yield and 93% confidence. It is supported by six prior experiments in the same temperature region.";
      if (value.toLowerCase().includes("next")) reply = "Run a narrower temperature window around 170-174C. The model is least certain at the edges.";
      if (value.toLowerCase().includes("batch")) reply = "The batch has five candidates: three exploit the best region and two add diversity. I would run all five.";
      state.agentLog.push({ role: "agent", text: reply });
      renderAgent();
    }, 600);
  }

  document.addEventListener("click", e => {
    const view = e.target.closest("[data-view]");
    if (view) { state.view = view.dataset.view; state.candidateId = null; render(); return; }
    const runEl = e.target.closest("[data-run]");
    if (runEl) { state.runId = runEl.dataset.run; state.view = "run"; state.tab = "Candidates"; state.candidateId = null; render(); return; }
    const cand = e.target.closest("[data-candidate]");
    if (cand) { state.candidateId = cand.dataset.candidate; render(); return; }
    const tab = e.target.closest("[data-tab]");
    if (tab) { state.tab = tab.dataset.tab; render(); return; }
    const result = e.target.closest("[data-result]");
    if (result) { openResult(result.dataset.result); return; }
    const choice = e.target.closest("[data-wizard-choice]");
    if (choice) { state.wizard[choice.dataset.wizardChoice] = choice.dataset.value; updateWizard(); return; }
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;
    if (action === "new-analysis") openWizard();
    else if (action === "close-modal") $("#modal").classList.remove("open");
    else if (action === "wizard-next") { state.wizard.step = Math.min(3, state.wizard.step + 1); updateWizard(); }
    else if (action === "wizard-back") { state.wizard.step = Math.max(0, state.wizard.step - 1); updateWizard(); }
    else if (action === "start-analysis") startAnalysis();
    else if (action === "approve-batch") approveBatch();
    else if (action === "save-result") saveResult(el.dataset.batch);
    else if (action === "add-to-batch") toast("Candidate added to the next batch.", "ok");
    else if (action === "open-agent") openAgent();
    else if (action === "close-agent") { $("#drawer").classList.remove("open"); }
    else if (action === "send-agent") { const input = $("#drawerInput"); sendAgent(input ? input.value : ""); if (input) input.value = ""; }
    else if (action === "export-protocol") toast("Protocol exported as PDF (demo).");
    else if (action === "import-csv") toast("CSV import queued (demo).", "warn");
    else if (action === "retrain") toast("Model retrain queued. Last run will be used.", "ok");
    else if (action === "toast") toast(el.dataset.message || "Done.");
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target && e.target.id === "drawerInput") { sendAgent(e.target.value); e.target.value = ""; }
  });

  ensureRunData();
  render();
</script>
</body>
</html>
