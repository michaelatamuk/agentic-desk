<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="titleB descB">
  <title id="titleB">JiuwenSwarm one-pager</title>
  <desc id="descB">JiuwenSwarm is the open agent platform; agent-core is the runtime underneath it.</desc>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#111111"/>
    </marker>
    <style>
      .sans { font-family: "Segoe UI", Arial, Helvetica, sans-serif; }
      .kicker { font-size: 13px; font-weight: 700; letter-spacing: 2.4px; fill: #E33A2E; }
      .body { font-size: 24px; fill: #111111; }
      .small { font-size: 15px; fill: #4E4E4A; }
      .boxTitle { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; fill: #111111; }
      .boxSub { font-size: 12px; fill: #4E4E4A; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#F7F5EF"/>
  <line x1="60" y1="56" x2="1540" y2="56" stroke="#111111" stroke-width="2"/>

  <text class="sans" x="58" y="200" font-size="150" font-weight="700" fill="#111111" letter-spacing="-6">JIUWENSWARM</text>
  <text class="sans" x="1520" y="96" text-anchor="end" font-size="13" font-weight="700" letter-spacing="2" fill="#E33A2E">COMPANY PLATFORM</text>
  <text class="sans" x="1520" y="124" text-anchor="end" font-size="22" font-weight="600" fill="#111111">28 NOV 2026</text>
  <text class="sans" x="60" y="258" font-size="30" fill="#111111">The open agent platform, with agent-core underneath.</text>
  <text class="sans" x="60" y="292" font-size="17" fill="#4E4E4A">One runtime for a single agent or a team, with channels, skills, memory and enterprise controls.</text>
  <line x1="60" y1="318" x2="1540" y2="318" stroke="#111111" stroke-width="2"/>
  <line x1="940" y1="318" x2="940" y2="1012" stroke="#111111" stroke-width="1"/>

  <text class="sans kicker" x="60" y="368">WHAT IT IS</text>
  <text class="sans body" x="60" y="416">JiuwenSwarm is the company's open agent platform.</text>
  <text class="sans body" x="60" y="454">It runs agents, teams, channels, skills and memory,</text>
  <text class="sans body" x="60" y="492">and puts them behind one gateway for the web, desktop,</text>
  <text class="sans body" x="60" y="530">the IDE and the chat apps a team already uses.</text>

  <text class="sans kicker" x="60" y="606">WHAT IT DOES</text>
  <line x1="60" y1="628" x2="900" y2="628" stroke="#111111" stroke-width="1"/>

  <text class="sans" x="60" y="662" font-size="18" font-weight="700" fill="#111111">Runs an agent or a team</text>
  <text class="sans small" x="60" y="686">Leader, members, goals, workflows and per-member shells.</text>

  <text class="sans" x="60" y="724" font-size="18" font-weight="700" fill="#111111">Connects the channels</text>
  <text class="sans small" x="60" y="748">Web, desktop, IDE, TUI, Slack, Feishu, WeChat and more.</text>

  <text class="sans" x="60" y="786" font-size="18" font-weight="700" fill="#111111">Keeps the project state</text>
  <text class="sans small" x="60" y="810">Sessions, skills, memory, approvals and enterprise policy.</text>

  <text class="sans kicker" x="60" y="870">WHY IT MATTERS</text>
  <line x1="60" y1="892" x2="900" y2="892" stroke="#111111" stroke-width="1"/>

  <text class="sans" x="60" y="922" font-size="15" fill="#111111"><tspan font-weight="700">Open source.</tspan> The code, issues, designs and release notes are public.</text>
  <text class="sans" x="60" y="950" font-size="15" fill="#111111"><tspan font-weight="700">One base.</tspan> Products share models, tools, memory and policy.</text>
  <text class="sans" x="60" y="978" font-size="15" fill="#111111"><tspan font-weight="700">Self-hosted.</tspan> A team can run the server and keep its own state.</text>

  <text class="sans small" x="60" y="1022">Today: active; about 2,200 commits in November. Our team contributes.</text>

  <text class="sans kicker" x="980" y="368">HOW IT WORKS</text>

  <rect x="1110" y="400" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="boxTitle" x="1130" y="427">YOUR PRODUCT</text>
  <text class="boxSub" x="1130" y="447">an app, a workspace, a bench</text>

  <rect x="1110" y="500" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="boxTitle" x="1130" y="527" fill="#E33A2E">JIUWENSWARM</text>
  <text class="boxSub" x="1130" y="547">gateway, channels, sessions, teams</text>

  <rect x="1110" y="600" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="boxTitle" x="1130" y="627">AGENT CORE</text>
  <text class="boxSub" x="1130" y="647">loop, tools, memory, rails</text>

  <rect x="1110" y="700" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="boxTitle" x="1130" y="727">MODELS + TOOLS</text>
  <text class="boxSub" x="1130" y="747">Claude, Codex, DeepSeek, MCP</text>

  <path d="M1265 462 L1265 496" stroke="#111111" stroke-width="2" marker-end="url(#arrowB)"/>
  <path d="M1265 562 L1265 596" stroke="#111111" stroke-width="2" marker-end="url(#arrowB)"/>
  <path d="M1265 662 L1265 696" stroke="#111111" stroke-width="2" marker-end="url(#arrowB)"/>

  <text class="sans small" x="980" y="800">JiuwenSwarm is the server.</text>
  <text class="sans small" x="980" y="822">agent-core is the runtime. Both are open source.</text>

  <line x1="980" y1="880" x2="1520" y2="880" stroke="#111111" stroke-width="2"/>
  <text class="sans" x="980" y="936" font-size="36" font-weight="700" fill="#111111">Single agent or a team.</text>
  <text class="sans" x="980" y="976" font-size="36" font-weight="700" fill="#E33A2E">One open platform.</text>

  <text class="sans" x="60" y="1074" font-size="13" fill="#4E4E4A">Source: company/openjiuwen/overview.md  ·  agent-core@e60add22a · jiuwenswarm@1586ff3e7  ·  Our team contributes; context, not our roadmap.</text>
  <text class="sans" x="1520" y="1074" text-anchor="end" font-size="13" fill="#4E4E4A">agentic-desk · one-pager</text>
</svg>
