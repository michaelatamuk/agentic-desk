<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="titleB descB">
  <title id="titleB">FLYBOT one-pager</title>
  <desc id="descB">Each person gets a private agent and space; teams share groups, work and automations.</desc>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#111111"/>
    </marker>
    <style>
      .sans { font-family: "Segoe UI", Arial, Helvetica, sans-serif; }
      .kicker { font-size: 13px; font-weight: 700; letter-spacing: 2.4px; fill: #E33A2E; }
      .body { font-size: 24px; fill: #111111; }
      .small { font-size: 15px; fill: #4E4E4A; }
      .boxTitle { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; fill: #111111; }
      .boxSub { font-size: 12px; fill: #4E4E4A; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#F7F5EF"/>
  <line x1="60" y1="56" x2="1540" y2="56" stroke="#111111" stroke-width="2"/>

  <text class="sans" x="58" y="200" font-size="150" font-weight="700" fill="#111111" letter-spacing="-5">FLYBOT</text>
  <text class="sans" x="1520" y="96" text-anchor="end" font-size="13" font-weight="700" letter-spacing="2" fill="#E33A2E">COMPANY PRODUCT</text>
  <text class="sans" x="1520" y="124" text-anchor="end" font-size="22" font-weight="600" fill="#111111">28 NOV 2026</text>
  <text class="sans" x="60" y="258" font-size="30" fill="#111111">A team workspace for AI agents that you run yourself.</text>
  <text class="sans" x="60" y="292" font-size="17" fill="#4E4E4A">Each person gets a private agent and space; teams share groups, work and automations.</text>
  <line x1="60" y1="318" x2="1540" y2="318" stroke="#111111" stroke-width="2"/>
  <line x1="940" y1="318" x2="940" y2="1012" stroke="#111111" stroke-width="1"/>

  <text class="sans kicker" x="60" y="368">WHAT IT IS</text>
  <text class="body" x="60" y="416">FlyBot is a web workspace for a small team that</text>
  <text class="body" x="60" y="454">runs its own server. Each account gets a private</text>
  <text class="body" x="60" y="492">agent, a personal space and ten ready-made helpers.</text>
  <text class="body" x="60" y="530">Teams can also talk to people and agents together.</text>

  <text class="sans kicker" x="60" y="606">WHAT IT DOES</text>
  <line x1="60" y1="628" x2="900" y2="628" stroke="#111111" stroke-width="1"/>

  <text class="sans" x="60" y="662" font-size="18" font-weight="700" fill="#111111">Chat, alone or together</text>
  <text class="sans small" x="60" y="686">A personal agent, groups, and up to five agents in one ask.</text>
  <text class="sans" x="60" y="724" font-size="18" font-weight="700" fill="#111111">Save and reuse work</text>
  <text class="sans small" x="60" y="748">Documents, slides, sites and boards, with versions and shares.</text>
  <text class="sans" x="60" y="786" font-size="18" font-weight="700" fill="#111111">Schedule and meet</text>
  <text class="sans small" x="60" y="810">Recurring jobs, meeting notes and action items.</text>

  <text class="sans kicker" x="60" y="870">WHY IT MATTERS</text>
  <line x1="60" y1="892" x2="900" y2="892" stroke="#111111" stroke-width="1"/>

  <text class="sans" x="60" y="922" font-size="15" fill="#111111"><tspan font-weight="700">You own the setup.</tspan> Your server, your model keys, your files.</text>
  <text class="sans" x="60" y="950" font-size="15" fill="#111111"><tspan font-weight="700">Private by account.</tspan> Each person has a separate space and storage.</text>
  <text class="sans" x="60" y="978" font-size="15" fill="#111111"><tspan font-weight="700">Agents in the team.</tspan> People and agents share a group, with limits.</text>

  <text class="sans small" x="60" y="1022">Today: version 0.3.0, active.</text>

  <text class="sans kicker" x="980" y="368">HOW IT WORKS</text>

  <rect x="1110" y="400" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="boxTitle" x="1130" y="427">YOU SIGN IN</text>
  <text class="boxSub" x="1130" y="447">in the browser</text>
  <path d="M1265 462 L1265 496" stroke="#111111" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="1110" y="500" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="boxTitle" x="1130" y="527">THE SERVICE ROUTES</text>
  <text class="boxSub" x="1130" y="547">to your own copy</text>
  <path d="M1265 562 L1265 596" stroke="#111111" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="1110" y="600" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="boxTitle" x="1130" y="627" fill="#E33A2E">YOUR AGENT WORKS</text>
  <text class="boxSub" x="1130" y="647">chat, files, memory, schedules</text>
  <path d="M1265 662 L1265 696" stroke="#111111" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="1110" y="700" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="boxTitle" x="1130" y="727">TEAMS SHARE</text>
  <text class="boxSub" x="1130" y="747">groups, invites and public pages</text>


  <text class="sans small" x="980" y="800">A shared service holds teams and public pages;</text>
  <text class="sans small" x="980" y="822">private work stays on your account.</text>

  <line x1="980" y1="880" x2="1520" y2="880" stroke="#111111" stroke-width="2"/>
  <text class="sans" x="980" y="936" font-size="36" font-weight="700" fill="#111111">Your team, your agents.</text>
  <text class="sans" x="980" y="976" font-size="36" font-weight="700" fill="#E33A2E">Your server.</text>

  <text class="sans" x="60" y="1074" font-size="13" fill="#4E4E4A">Source: company/flybot/overview.md  ·  Built by another team in the company.  ·  Context, not our roadmap.</text>
  <text class="sans" x="1520" y="1074" text-anchor="end" font-size="13" fill="#4E4E4A">agentic-desk · one-pager</text>
</svg>
