  <text x="1261" y="333" class="label">Coordinates</text>
  <text x="1261" y="403" class="heading">Claude Code</text>
  <text x="1261" y="434" class="label">Investigates</text>
  <text x="1261" y="505" class="heading">Codex</text>
  <text x="1261" y="536" class="label">Reviews</text>
  <text x="1261" y="608" class="heading">Jiuwen</text>
  <text x="1261" y="639" class="label">General assistant</text>
  <path d="M1195 309H1225M1195 410H1225M1195 512H1225M1195 615H1225" class="line"/>
  <circle cx="1210" cy="309" r="5" fill="#277c74"/>
  <circle cx="1210" cy="410" r="5" fill="#277c74"/>
  <circle cx="1210" cy="512" r="5" fill="#277c74"/>
  <circle cx="1210" cy="615" r="5" fill="#277c74"/>
  <rect x="365" y="680" width="830" height="99" rx="18" fill="#f0efe9"/>
  <text x="391" y="719" font-size="27" font-weight="700">Project instructions · Conversation history · Files</text>
  <text x="391" y="755" font-size="25" fill="#64736e">Agents use permitted sources and saved facts.</text>
  <path d="M40 805H1520" stroke="#dedfd8" stroke-width="2"/>
  <circle cx="51" cy="834" r="7" fill="#277c74"/>
  <text x="72" y="843" font-size="27">With participation enabled, agents can also contribute to the discussion.</text>
  <text x="40" y="872" font-size="22" fill="#64736e">Connected chats require permissions. Personal notes stay private.</text>
</svg>
