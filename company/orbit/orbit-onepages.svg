<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="titleB descB">
  <title id="titleB">Orbit one-pager</title>
  <desc id="descB">Orbit is a desktop workspace where a team, its AI agents and the chats it already uses work in one shared project room.</desc>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#111111"/>
    </marker>
    <style>
      .sans { font-family: "Segoe UI", Arial, Helvetica, sans-serif; }
      .kicker { font-size: 13px; font-weight: 700; letter-spacing: 2.4px; fill: #E33A2E; }
      .body { font-size: 24px; fill: #111111; }
      .small { font-size: 15px; fill: #4E4E4A; }
      .boxTitle { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; fill: #111111; }
      .boxSub { font-size: 12px; fill: #4E4E4A; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#F7F5EF"/>
  <line x1="60" y1="56" x2="1540" y2="56" stroke="#111111" stroke-width="2"/>

  <!-- Header -->
  <text class="sans" x="58" y="200" font-size="150" font-weight="700" fill="#111111" letter-spacing="-5">ORBIT</text>
  <text class="sans" x="1520" y="96" text-anchor="end" font-size="13" font-weight="700" letter-spacing="2" fill="#E33A2E">COMPANY PRODUCT</text>
  <text class="sans" x="1520" y="124" text-anchor="end" font-size="22" font-weight="600" fill="#111111">28 NOV 2026</text>
  <text class="sans" x="60" y="258" font-size="30" fill="#111111">A shared room for a team and its AI agents.</text>
  <text class="sans" x="60" y="292" font-size="17" fill="#4E4E4A">A desktop app that brings people, their agents and the chats they already use into one place.</text>
  <line x1="60" y1="318" x2="1540" y2="318" stroke="#111111" stroke-width="2"/>
  <line x1="940" y1="318" x2="940" y2="1012" stroke="#111111" stroke-width="1"/>

  <!-- Left: what it is -->
  <text class="sans kicker" x="60" y="368">WHAT IT IS</text>
  <text class="sans body" x="60" y="416">Orbit is a place on your desktop for project work.</text>
  <text class="sans body" x="60" y="454">You make a room, invite people and their AI agents,</text>
  <text class="sans body" x="60" y="492">and connect the chats and files the project uses.</text>
  <text class="sans body" x="60" y="530">You ask in plain words; the work stays in that room.</text>

  <!-- Left: what it does -->
  <text class="sans kicker" x="60" y="606">WHAT IT DOES</text>
  <line x1="60" y1="628" x2="900" y2="628" stroke="#111111" stroke-width="1"/>

  <text class="sans" x="60" y="662" font-size="18" font-weight="700" fill="#111111">Brings the team together</text>
  <text class="sans small" x="60" y="686">People and agents in one room, with Slack, Feishu or WeChat linked in.</text>

  <text class="sans" x="60" y="724" font-size="18" font-weight="700" fill="#111111">Gives work to the right agent</text>
  <text class="sans small" x="60" y="748">Claude Code, Codex or Orbit's own helper. It picks one and combines their results.</text>

  <text class="sans" x="60" y="786" font-size="18" font-weight="700" fill="#111111">Keeps the project and follows up</text>
  <text class="sans small" x="60" y="810">Decisions and earlier work stay for next time. A watch can bring back updates.</text>

  <!-- Left: why it matters -->
  <text class="sans kicker" x="60" y="870">WHY IT MATTERS</text>
  <line x1="60" y1="892" x2="900" y2="892" stroke="#111111" stroke-width="1"/>

  <text class="sans" x="60" y="922" font-size="15" fill="#111111"><tspan font-weight="700">One room, not five tabs.</tspan> The talk, files and result stay together.</text>
  <text class="sans" x="60" y="950" font-size="15" fill="#111111"><tspan font-weight="700">Your agents.</tspan> Claude Code and Codex keep their own settings and history.</text>
  <text class="sans" x="60" y="978" font-size="15" fill="#111111"><tspan font-weight="700">You decide what leaves.</tspan> Messages wait for your OK before they go out.</text>

  <text class="sans small" x="60" y="1022">Today: it runs from the source code on macOS and Linux. There is no installer yet.</text>

  <!-- Right: how it works -->
  <text class="sans kicker" x="980" y="368">HOW IT WORKS</text>

  <rect x="1110" y="400" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="sans boxTitle" x="1130" y="427">YOU ASK</text>
  <text class="sans boxSub" x="1130" y="447">in a room, in your own words</text>

  <rect x="1110" y="500" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="sans boxTitle" x="1130" y="527">ORBIT PICKS</text>
  <text class="sans boxSub" x="1130" y="547">an agent or a teammate</text>

  <rect x="1110" y="600" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="sans boxTitle" x="1130" y="627" fill="#E33A2E">THEY WORK</text>
  <text class="sans boxSub" x="1130" y="647">and can ask each other questions</text>

  <rect x="1110" y="700" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="sans boxTitle" x="1130" y="727">YOU APPROVE</text>
  <text class="sans boxSub" x="1130" y="747">before a message goes out</text>

  <path d="M1265 462 L1265 496" stroke="#111111" stroke-width="2" marker-end="url(#arrowB)"/>
  <path d="M1265 562 L1265 596" stroke="#111111" stroke-width="2" marker-end="url(#arrowB)"/>
  <path d="M1265 662 L1265 696" stroke="#111111" stroke-width="2" marker-end="url(#arrowB)"/>

  <text class="sans small" x="980" y="800">Every result keeps the files and sources behind it.</text>
  <text class="sans small" x="980" y="822">You can see who did what, and why.</text>

  <!-- Right: pull quote -->
  <line x1="980" y1="880" x2="1520" y2="880" stroke="#111111" stroke-width="2"/>
  <text class="sans" x="980" y="936" font-size="36" font-weight="700" fill="#111111">The room keeps the work.</text>
  <text class="sans" x="980" y="976" font-size="36" font-weight="700" fill="#E33A2E">You decide what leaves.</text>

  <!-- Footer -->
  <text class="sans" x="60" y="1074" font-size="13" fill="#4E4E4A">Source: company/orbit/overview.md  ·  Public repo ThinkFlowLab/orbit  ·  Orbit is built by another team.</text>
  <text class="sans" x="1520" y="1074" text-anchor="end" font-size="13" fill="#4E4E4A">agentic-desk · one-pager</text>
</svg>
