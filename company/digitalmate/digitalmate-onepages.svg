<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="titleB descB">
  <title id="titleB">DIGITALMATE one-pager</title>
  <desc id="descB">Ask for something in one sentence. It runs in the cloud and brings back a result you can edit.</desc>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#111111"/>
    </marker>
    <style>
      .sans { font-family: "Segoe UI", Arial, Helvetica, sans-serif; }
      .kicker { font-size: 13px; font-weight: 700; letter-spacing: 2.4px; fill: #E33A2E; }
      .body { font-size: 24px; fill: #111111; }
      .small { font-size: 15px; fill: #4E4E4A; }
      .boxTitle { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; fill: #111111; }
      .boxSub { font-size: 12px; fill: #4E4E4A; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#F7F5EF"/>
  <line x1="60" y1="56" x2="1540" y2="56" stroke="#111111" stroke-width="2"/>

  <text class="sans" x="58" y="200" font-size="150" font-weight="700" fill="#111111" letter-spacing="-5">DIGITALMATE</text>
  <text class="sans" x="1520" y="96" text-anchor="end" font-size="13" font-weight="700" letter-spacing="2" fill="#E33A2E">COMPANY PRODUCT</text>
  <text class="sans" x="1520" y="124" text-anchor="end" font-size="22" font-weight="600" fill="#111111">15 NOV 2026</text>
  <text class="sans" x="60" y="258" font-size="30" fill="#111111">An AI assistant for your phone.</text>
  <text class="sans" x="60" y="292" font-size="17" fill="#4E4E4A">Ask for something in one sentence. It runs in the cloud and brings back a result you can edit.</text>
  <line x1="60" y1="318" x2="1540" y2="318" stroke="#111111" stroke-width="2"/>
  <line x1="940" y1="318" x2="940" y2="1012" stroke="#111111" stroke-width="1"/>

  <text class="sans kicker" x="60" y="368">WHAT IT IS</text>
  <text class="body" x="60" y="416">DigitalMate is an AI assistant for a HarmonyOS phone.</text>
  <text class="body" x="60" y="454">You give it a task; a cloud server does the work and</text>
  <text class="body" x="60" y="492">sends back a result you can read, edit and follow up.</text>
  <text class="body" x="60" y="530">A second tab is a feed of videos, articles and posts.</text>

  <text class="sans kicker" x="60" y="606">WHAT IT DOES</text>
  <line x1="60" y1="628" x2="900" y2="628" stroke="#111111" stroke-width="1"/>

  <text class="sans" x="60" y="662" font-size="18" font-weight="700" fill="#111111">Runs tasks in the cloud</text>
  <text class="sans small" x="60" y="686">The phone stays light; the server keeps the work and history.</text>
  <text class="sans" x="60" y="724" font-size="18" font-weight="700" fill="#111111">Adds skills and tools</text>
  <text class="sans small" x="60" y="748">Install skills or connect an outside tool for one conversation.</text>
  <text class="sans" x="60" y="786" font-size="18" font-weight="700" fill="#111111">Shows a personal feed</text>
  <text class="sans small" x="60" y="810">Videos, articles and posts from several sources, ranked for you.</text>

  <text class="sans kicker" x="60" y="870">WHY IT MATTERS</text>
  <line x1="60" y1="892" x2="900" y2="892" stroke="#111111" stroke-width="1"/>

  <text class="sans" x="60" y="922" font-size="15" fill="#111111"><tspan font-weight="700">A light phone.</tspan> The heavy work runs on a server, not the phone.</text>
  <text class="sans" x="60" y="950" font-size="15" fill="#111111"><tspan font-weight="700">Work that waits for you.</tspan> Tasks, answers and history are there when you return.</text>
  <text class="sans" x="60" y="978" font-size="15" fill="#111111"><tspan font-weight="700">One feed, many sources.</tspan> Local tools merge and rank what you might read.</text>

  <text class="sans small" x="60" y="1022">Today: tasks, feed, skills and connections work. Some server parts are still being rebuilt.</text>

  <text class="sans kicker" x="980" y="368">HOW IT WORKS</text>

  <rect x="1110" y="400" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="boxTitle" x="1130" y="427">YOU ASK</text>
  <text class="boxSub" x="1130" y="447">one sentence, files if needed</text>
  <path d="M1265 462 L1265 496" stroke="#111111" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="1110" y="500" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="boxTitle" x="1130" y="527">THE SERVER</text>
  <text class="boxSub" x="1130" y="547">runs the task with skills and tools</text>
  <path d="M1265 562 L1265 596" stroke="#111111" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="1110" y="600" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="boxTitle" x="1130" y="627" fill="#E33A2E">THE AGENT</text>
  <text class="boxSub" x="1130" y="647">works step by step and checks</text>
  <path d="M1265 662 L1265 696" stroke="#111111" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="1110" y="700" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="boxTitle" x="1130" y="727">YOU GET A RESULT</text>
  <text class="boxSub" x="1130" y="747">read it, edit it, follow up</text>


  <text class="sans small" x="980" y="800">The phone only asks and shows.</text>
  <text class="sans small" x="980" y="822">The server owns the task and its history.</text>

  <line x1="980" y1="880" x2="1520" y2="880" stroke="#111111" stroke-width="2"/>
  <text class="sans" x="980" y="936" font-size="32" font-weight="700" fill="#111111">A task in one sentence.</text>
  <text class="sans" x="980" y="976" font-size="32" font-weight="700" fill="#E33A2E">The work happens in the cloud.</text>

  <text class="sans" x="60" y="1074" font-size="13" fill="#4E4E4A">Source: company/digitalmate/overview.md  ·  Built by another team in the company.  ·  Context, not our roadmap.</text>
  <text class="sans" x="1520" y="1074" text-anchor="end" font-size="13" fill="#4E4E4A">agentic-desk · one-pager</text>
</svg>
