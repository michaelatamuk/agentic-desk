<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="titleB descB">
  <title id="titleB">AGENTDESCENT one-pager</title>
  <desc id="descB">It runs an agent on real tasks, learns from what failed, and keeps changes that hold up on unseen tasks.</desc>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#111111"/>
    </marker>
    <style>
      .sans { font-family: "Segoe UI", Arial, Helvetica, sans-serif; }
      .kicker { font-size: 13px; font-weight: 700; letter-spacing: 2.4px; fill: #E33A2E; }
      .body { font-size: 24px; fill: #111111; }
      .small { font-size: 15px; fill: #4E4E4A; }
      .boxTitle { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; fill: #111111; }
      .boxSub { font-size: 12px; fill: #4E4E4A; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#F7F5EF"/>
  <line x1="60" y1="56" x2="1540" y2="56" stroke="#111111" stroke-width="2"/>

  <text class="sans" x="58" y="200" font-size="150" font-weight="700" fill="#111111" letter-spacing="-5">AGENTDESCENT</text>
  <text class="sans" x="1520" y="96" text-anchor="end" font-size="13" font-weight="700" letter-spacing="2" fill="#E33A2E">COMPANY PRODUCT</text>
  <text class="sans" x="1520" y="124" text-anchor="end" font-size="22" font-weight="600" fill="#111111">28 NOV 2026</text>
  <text class="sans" x="60" y="258" font-size="30" fill="#111111">A feedback loop for better instructions and skills.</text>
  <text class="sans" x="60" y="292" font-size="17" fill="#4E4E4A">It runs an agent on real tasks, learns from what failed, and keeps changes that hold up on unseen tasks.</text>
  <line x1="60" y1="318" x2="1540" y2="318" stroke="#111111" stroke-width="2"/>
  <line x1="940" y1="318" x2="940" y2="1012" stroke="#111111" stroke-width="1"/>

  <text class="sans kicker" x="60" y="368">WHAT IT IS</text>
  <text class="body" x="60" y="416">AgentDescent improves the things around an agent:</text>
  <text class="body" x="60" y="454">its instructions, its skills, its tool list or its code.</text>
  <text class="body" x="60" y="492">It does not train the model. It tries changes,</text>
  <text class="body" x="60" y="530">tests them, and keeps the ones that work.</text>

  <text class="sans kicker" x="60" y="606">WHAT IT DOES</text>
  <line x1="60" y1="628" x2="900" y2="628" stroke="#111111" stroke-width="1"/>

  <text class="sans" x="60" y="662" font-size="18" font-weight="700" fill="#111111">Finds what failed</text>
  <text class="sans small" x="60" y="686">Runs tasks and scores each result.</text>
  <text class="sans" x="60" y="724" font-size="18" font-weight="700" fill="#111111">Proposes fixes in parallel</text>
  <text class="sans small" x="60" y="748">Several workers suggest edits, each with evidence.</text>
  <text class="sans" x="60" y="786" font-size="18" font-weight="700" fill="#111111">Keeps only what holds</text>
  <text class="sans small" x="60" y="810">A change must help on tasks it has never seen.</text>

  <text class="sans kicker" x="60" y="870">WHY IT MATTERS</text>
  <line x1="60" y1="892" x2="900" y2="892" stroke="#111111" stroke-width="1"/>

  <text class="sans" x="60" y="922" font-size="15" fill="#111111"><tspan font-weight="700">No model training.</tspan> The model stays the same; the instructions get better.</text>
  <text class="sans" x="60" y="950" font-size="15" fill="#111111"><tspan font-weight="700">Faster than one loop.</tspan> Many workers propose at once; one merge decides.</text>
  <text class="sans" x="60" y="978" font-size="15" fill="#111111"><tspan font-weight="700">Every change has a history.</tspan> A version, a reason and the test behind it.</text>

  <text class="sans small" x="60" y="1022">Today: a research project, version 0.11.0, not a finished product.</text>

  <text class="sans kicker" x="980" y="368">HOW IT WORKS</text>

  <rect x="1110" y="400" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="boxTitle" x="1130" y="427">GIVE IT TASKS</text>
  <text class="boxSub" x="1130" y="447">with a way to score the result</text>
  <path d="M1265 462 L1265 496" stroke="#111111" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="1110" y="500" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="boxTitle" x="1130" y="527">WORKERS TRY</text>
  <text class="boxSub" x="1130" y="547">each proposes a change</text>
  <path d="M1265 562 L1265 596" stroke="#111111" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="1110" y="600" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="boxTitle" x="1130" y="627" fill="#E33A2E">ONE MERGES</text>
  <text class="boxSub" x="1130" y="647">drops clashes, combines what fits</text>
  <path d="M1265 662 L1265 696" stroke="#111111" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="1110" y="700" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="boxTitle" x="1130" y="727">A TEST IT HAS NOT SEEN</text>
  <text class="boxSub" x="1130" y="747">keep it only if that test improves</text>


  <text class="sans small" x="980" y="800">Accepted changes live in a version history,</text>
  <text class="sans small" x="980" y="822">so any result can be traced back.</text>

  <line x1="980" y1="880" x2="1520" y2="880" stroke="#111111" stroke-width="2"/>
  <text class="sans" x="980" y="936" font-size="36" font-weight="700" fill="#111111">The model stays.</text>
  <text class="sans" x="980" y="976" font-size="36" font-weight="700" fill="#E33A2E">The instructions improve.</text>

  <text class="sans" x="60" y="1074" font-size="13" fill="#4E4E4A">Source: company/agentdescent/overview.md  ·  Built by another team in the company.  ·  Context, not our roadmap.</text>
  <text class="sans" x="1520" y="1074" text-anchor="end" font-size="13" fill="#4E4E4A">agentic-desk · one-pager</text>
</svg>
