<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="titleB descB">
  <title id="titleB">NULLIUS one-pager</title>
  <desc id="descB">Run a test, then open every score into the evidence behind it.</desc>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#111111"/>
    </marker>
    <style>
      .sans { font-family: "Segoe UI", Arial, Helvetica, sans-serif; }
      .kicker { font-size: 13px; font-weight: 700; letter-spacing: 2.4px; fill: #E33A2E; }
      .body { font-size: 24px; fill: #111111; }
      .small { font-size: 15px; fill: #4E4E4A; }
      .boxTitle { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; fill: #111111; }
      .boxSub { font-size: 12px; fill: #4E4E4A; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#F7F5EF"/>
  <line x1="60" y1="56" x2="1540" y2="56" stroke="#111111" stroke-width="2"/>

  <text class="sans" x="58" y="200" font-size="150" font-weight="700" fill="#111111" letter-spacing="-5">NULLIUS</text>
  <text class="sans" x="1520" y="96" text-anchor="end" font-size="13" font-weight="700" letter-spacing="2" fill="#E33A2E">COMPANY PRODUCT</text>
  <text class="sans" x="1520" y="124" text-anchor="end" font-size="22" font-weight="600" fill="#111111">28 NOV 2026</text>
  <text class="sans" x="60" y="258" font-size="30" fill="#111111">A workbench that shows why an AI agent failed.</text>
  <text class="sans" x="60" y="292" font-size="17" fill="#4E4E4A">Run a test, then open every score into the evidence behind it.</text>
  <line x1="60" y1="318" x2="1540" y2="318" stroke="#111111" stroke-width="2"/>
  <line x1="940" y1="318" x2="940" y2="1012" stroke="#111111" stroke-width="1"/>

  <text class="sans kicker" x="60" y="368">WHAT IT IS</text>
  <text class="body" x="60" y="416">Nullius runs a test against an AI agent.</text>
  <text class="body" x="60" y="454">Instead of one score, it keeps the run, the</text>
  <text class="body" x="60" y="492">conversation, the tools, the files and the judge's</text>
  <text class="body" x="60" y="530">report, so you can see what actually happened.</text>

  <text class="sans kicker" x="60" y="606">WHAT IT DOES</text>
  <line x1="60" y1="628" x2="900" y2="628" stroke="#111111" stroke-width="1"/>

  <text class="sans" x="60" y="662" font-size="18" font-weight="700" fill="#111111">Runs test sets</text>
  <text class="sans small" x="60" y="686">Local, remote or several machines.</text>
  <text class="sans" x="60" y="724" font-size="18" font-weight="700" fill="#111111">Checks the test itself</text>
  <text class="sans small" x="60" y="748">A do-nothing agent must score zero; a perfect one must pass.</text>
  <text class="sans" x="60" y="786" font-size="18" font-weight="700" fill="#111111">Shows the evidence</text>
  <text class="sans small" x="60" y="810">Every attempt opens into its steps, files and result.</text>

  <text class="sans kicker" x="60" y="870">WHY IT MATTERS</text>
  <line x1="60" y1="892" x2="900" y2="892" stroke="#111111" stroke-width="1"/>

  <text class="sans" x="60" y="922" font-size="15" fill="#111111"><tspan font-weight="700">Agent or test?</tspan> It separates a bad agent from a broken test.</text>
  <text class="sans" x="60" y="950" font-size="15" fill="#111111"><tspan font-weight="700">No hidden failures.</tspan> A timeout or setup error is shown, not counted as a wrong answer.</text>
  <text class="sans" x="60" y="978" font-size="15" fill="#111111"><tspan font-weight="700">Proof, not claims.</tspan> An agent is offered only for tests it has proved it can run.</text>

  <text class="sans small" x="60" y="1022">Today: an early version, 0.2.0, with a local web page.</text>

  <text class="sans kicker" x="980" y="368">HOW IT WORKS</text>

  <rect x="1110" y="400" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="boxTitle" x="1130" y="427">PICK A TEST</text>
  <text class="boxSub" x="1130" y="447">and an agent that fits it</text>
  <path d="M1265 462 L1265 496" stroke="#111111" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="1110" y="500" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="boxTitle" x="1130" y="527">CHECK THE TEST</text>
  <text class="boxSub" x="1130" y="547">a do-nothing run and a perfect run</text>
  <path d="M1265 562 L1265 596" stroke="#111111" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="1110" y="600" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="boxTitle" x="1130" y="627" fill="#E33A2E">RUN THE AGENT</text>
  <text class="boxSub" x="1130" y="647">keep every step and file</text>
  <path d="M1265 662 L1265 696" stroke="#111111" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="1110" y="700" width="310" height="62" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text class="boxTitle" x="1130" y="727">READ THE EVIDENCE</text>
  <text class="boxSub" x="1130" y="747">pass, fail, or the test is broken</text>


  <text class="sans small" x="980" y="800">Raw score, adjusted score and mean score</text>
  <text class="sans small" x="980" y="822">are reported apart.</text>

  <line x1="980" y1="880" x2="1520" y2="880" stroke="#111111" stroke-width="2"/>
  <text class="sans" x="980" y="936" font-size="36" font-weight="700" fill="#111111">A score is not an answer.</text>
  <text class="sans" x="980" y="976" font-size="36" font-weight="700" fill="#E33A2E">Show me the evidence.</text>

  <text class="sans" x="60" y="1074" font-size="13" fill="#4E4E4A">Source: company/nullius/overview.md  ·  Built by another team in the company.  ·  Context, not our roadmap.</text>
  <text class="sans" x="1520" y="1074" text-anchor="end" font-size="13" fill="#4E4E4A">agentic-desk · one-pager</text>
</svg>
